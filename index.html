<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma - Centro de Mando</title>
    <style>
        :root {
            --azul-axioma: #00a3ff;
            --dorado-forense: #C5A059;
            --fondo-oscuro: #050a14;
            --tarjeta-oscura: #0a1120;
            --exito: #28a745;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--fondo-oscuro);
            color: #ffffff;
            display: flex;
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: var(--tarjeta-oscura);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #1e2a44;
            box-shadow: 0 0 25px rgba(0, 163, 255, 0.15);
            text-align: center;
            max-width: 450px;
            width: 100%;
            margin-bottom: 20px;
        }
        .hidden { display: none; }
        h1 { font-size: 1.4rem; letter-spacing: 3px; margin-bottom: 5px; color: #ffffff; }
        h2 { margin-top: 0; margin-bottom: 15px; font-size: 0.75rem; color: var(--azul-axioma); text-transform: uppercase; letter-spacing: 1px; }
        
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: #000000;
            color: var(--azul-axioma);
            border: 1px solid #1e2a44;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            font-size: 0.9rem;
            outline: none;
        }

        #nombre_fiscal {
            font-size: 0.75rem;
            color: var(--dorado-forense);
            margin-bottom: 15px;
            min-height: 1.2rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .btn-barrido { background-color: #ccc; color: #666; cursor: not-allowed; }
        .btn-barrido.active { background-color: #002060; color: white; border: 1px solid var(--azul-axioma); cursor: pointer; }
        .btn-vinculo { background-color: var(--exito); color: white; font-size: 0.8rem; margin-top: 15px; }
        .btn-registro { background-color: #004d40; color: white; }

        .file-zone {
            margin: 10px 0; 
            border: 1px dashed #333; 
            padding: 10px; 
            border-radius: 8px;
            font-size: 0.7rem;
            text-align: left;
            background: #000;
        }
        .file-zone label { color: var(--azul-axioma); display: block; margin-bottom: 5px; }

        .footer { margin-top: 20px; font-size: 0.55rem; color: #444; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="container" id="view_identidad">
        <h1>VERTEX AXIOMA®</h1>
        <h2>Centro de Mando</h2>
        <input type="number" id="cuitInput" placeholder="DNI O CUIT (SIN GUIONES)" onblur="validarIdentidad()">
        <div id="nombre_fiscal">ESPERANDO IDENTIFICACIÓN...</div>
        
        <div id="ops_seguridad" class="hidden">
            <input type="password" id="tokenInput" placeholder="INGRESE TOKEN VERTEX" oninput="chequearToken()">
            <button id="btnBarrido" class="btn-barrido" disabled onclick="ejecutarBarrido()">BLOQUEADO: REQUIERE TOKEN</button>
        </div>

        <button class="btn-vinculo" id="btnMostrarAlta" onclick="mostrarAlta()">NUEVO AGENTE: SOLICITAR ALTA</button>
    </div>

    <div class="container hidden" id="view_alta">
        <h1>ALTA DE AGENTE</h1>
        <h2>Legajo Digital Forense</h2>
        <input type="text" id="reg_nombre" placeholder="NOMBRE COMPLETO">
        <input type="email" id="reg_mail" placeholder="MAIL DE CONTACTO">
        <input type="tel" id="reg_tel" placeholder="CELULAR DE REFERENCIA">
        
        <div class="file-zone">
            <label>1. FOTO DNI (FRENTE/DORSO):</label>
            <input type="file" id="fileDni" accept="image/*">
        </div>
        <div class="file-zone">
            <label>2. CONSTANCIA CUIT (PDF/IMG):</label>
            <input type="file" id="fileCuit" accept="application/pdf,image/*">
        </div>
        <div class="file-zone">
            <label>3. SELFIE BIOMÉTRICA:</label>
            <input type="file" id="fileSelfie" accept="image/*" capture="user">
        </div>

        <button class="btn-vinculo" id="btnEnviarLegajo" onclick="enviarLegajo()">ENVIAR LEGAJO A REVISIÓN</button>
        <button onclick="location.reload()" style="background:none; color:#666; font-size:0.7rem;">CANCELAR</button>
    </div>

    <div class="container hidden" id="view_activos">
        <h1>REGISTRO VERTEX®</h1>
        <h2>Declaración de Activos</h2>
        <select id="tipoActivo">
            <option value="DRON">DRON / UNIDAD AÉREA</option>
            <option value="BALANZA">BALANZA / PESAJE</option>
            <option value="CAMION">TRANSPORTE / CAMIÓN</option>
            <option value="PDF_LEGAL">CONTRATO / PDF</option>
        </select>
        <input type="text" id="idPrincipal" placeholder="N° DE SERIE / CHASIS">
        <div class="file-zone">
            <label>EVIDENCIA (CAPTURA EN VIVO):</label>
            <input type="file" id="fileActivo" accept="image/*" capture="camera">
        </div>
        <button class="btn-registro" onclick="subirActivo()">EMITIR SELLO DE INMUTABILIDAD</button>
    </div>

    <div class="footer">CONSTITUCIÓN AXIOMA® | PROTECCIÓN FORENSE</div>

    <script>
    const urlNodo = "https://script.google.com/macros/s/AKfycbwb8leHLASqG0mf9DXXiD5JgAbzaK-3X4g30zgkyOf0wUT3LU5VMKlTzZY1PEbcjQY/exec"; // Reemplaza con tu URL de implementación

    async function validarIdentidad() {
        let id = document.getElementById('cuitInput').value;
        const visor = document.getElementById('nombre_fiscal');
        if(!id) return;
        visor.innerText = "SINCRONIZANDO...";
        
        try {
            const response = await fetch(urlNodo + "?cuit=" + id);
            const res = await response.json();
            if(res.exito) {
                visor.innerText = "✓ " + res.nombre;
                visor.style.color = "var(--dorado-forense)";
                document.getElementById('ops_seguridad').classList.remove('hidden');
                document.getElementById('view_activos').classList.remove('hidden');
                document.getElementById('btnMostrarAlta').classList.add('hidden');
            } else {
                visor.innerText = "IDENTIDAD NO LOCALIZADA";
                visor.style.color = "#ff4444";
            }
        } catch(e) { visor.innerText = "NODO FUERA DE LÍNEA"; }
    }

    function chequearToken() {
        const t = document.getElementById('tokenInput').value;
        const btn = document.getElementById('btnBarrido');
        if(t.length >= 4) {
            btn.disabled = false;
            btn.classList.add('active');
            btn.innerText = "INICIAR BARRIDO DE NODOS";
        } else {
            btn.disabled = true;
            btn.classList.remove('active');
            btn.innerText = "BLOQUEADO: REQUIERE TOKEN";
        }
    }

    function mostrarAlta() {
        document.getElementById('view_identidad').classList.add('hidden');
        document.getElementById('view_alta').classList.remove('hidden');
    }

    async function enviarLegajo() {
        const btn = document.getElementById('btnEnviarLegajo');
        btn.innerText = "ARCHIVANDO LEGAJO...";
        btn.disabled = true;

        const getBase64 = (file) => new Promise((res) => {
            if (!file) res("");
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => res(reader.result.split(',')[1]);
        });

        const datos = {
            accion: "solicitud_alta",
            cuit: document.getElementById('cuitInput').value || document.getElementById('reg_nombre').value, 
            nombre: document.getElementById('reg_nombre').value,
            mail: document.getElementById('reg_mail').value,
            celular: document.getElementById('reg_tel').value,
            dniBase64: await getBase64(document.getElementById('fileDni').files[0]),
            cuitBase64: await getBase64(document.getElementById('fileCuit').files[0]),
            selfieBase64: await getBase64(document.getElementById('fileSelfie').files[0]),
            hardwareID: navigator.userAgent
        };

        fetch(urlNodo, { method: 'POST', body: JSON.stringify(datos) })
        .then(() => {
            alert("LEGAJO ENVIADO AL NODO. ESPERE VALIDACIÓN DE AUDITORÍA.");
            location.reload();
        });
    }

    function ejecutarBarrido() {
        const t = document.getElementById('tokenInput').value;
        alert("BARRIDO INICIADO CON TOKEN: " + t + "\nVerificando integridad de activos...");
    }
    </script>
</body>
</html>
