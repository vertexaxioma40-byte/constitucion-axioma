<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma | Nodo de Innovación</title>
    <style>
        html, body { background-color: #050a15; color: #ffffff; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { display: flex; flex-direction: column; align-items: center; padding: 50px 20px; }
        .container { background: #0a1122; padding: 40px; border: 2px solid #002060; border-radius: 10px; box-shadow: 0 0 30px rgba(0, 32, 96, 0.6); width: 100%; max-width: 500px; text-align: center; }
        h1 { font-size: 1.8rem; letter-spacing: 3px; color: #ffffff; margin-bottom: 5px; }
        .subtitle { color: #4da6ff; font-size: 0.9rem; margin-bottom: 30px; display: block; }
        form { display: flex; flex-direction: column; gap: 15px; }
        label { font-size: 0.75rem; color: #4da6ff; text-align: left; text-transform: uppercase; font-weight: bold; margin-top: 10px; }
        input, select { background: #000; border: 1px solid #4da6ff; color: #fff; padding: 12px; font-family: 'Courier New', monospace; }
        button { background: #002060; color: #fff; border: 1px solid #4da6ff; padding: 18px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #003399; box-shadow: 0 0 15px #4da6ff; }
        .footer-text { font-size: 0.7rem; color: #4da6ff; margin-top: 20px; opacity: 0.7; }
    </style>
</head>
<body>

<div class="container">
    <h1>VERTEX AXIOMA®</h1>
    <span class="subtitle">Auditoría 4.0 & Integridad Forense</span>
    
    <form id="main-form">
        <label>Identificación Operador</label>
        <input type="text" id="nombre" placeholder="TU NOMBRE COMPLETO" required>
        <input type="email" id="email" placeholder="TU CORREO" required>
        
        <label>Identificación Titular del Activo</label>
        <input type="text" id="titular" placeholder="NOMBRE DEL TITULAR / EMPRESA" required>
        <input type="email" id="mailEmpresa" placeholder="CORREO DEL TITULAR" required>

        <label>Documentación</label>
        <select id="documento" required>
            <option value="sello" selected>SELLO DE INMUTABILIDAD TRANSFRONTERIZA</option>
        </select>
        
        <button type="submit" id="submit-btn">INGRESAR AL NODO</button>
    </form>
    
    <p class="footer-text">Sincronizado con Nodo Vertex Axioma</p>
</div>

<script>
    const form = document.getElementById('main-form');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', e => {
        e.preventDefault(); 
        
        btn.innerText = "ACCEDIENDO AL NODO...";
        btn.disabled = true;

        // 1. Capturamos los datos
        const nombreVal = document.getElementById('nombre').value;
        const emailVal = document.getElementById('email').value;
        const titularVal = document.getElementById('titular').value;
        const mailEmpresaVal = document.getElementById('mailEmpresa').value;

        // 2. Guardamos en localStorage para respaldo
        localStorage.setItem('v_nombre', nombreVal);
        localStorage.setItem('v_email', emailVal);
        localStorage.setItem('v_titular', titularVal);
        localStorage.setItem('v_mailEmpresa', mailEmpresaVal);

        // 3. Pedimos la URL al servidor de forma explícita
        // Esto es lo que Google recomienda para evitar bloqueos
        google.script.run.withSuccessHandler(function(url) {
            const params = `?p=terminal&nombre=${encodeURIComponent(nombreVal)}&email=${encodeURIComponent(emailVal)}&titular=${encodeURIComponent(titularVal)}&mailEmpresa=${encodeURIComponent(mailEmpresaVal)}`;
            
            // Forzamos la redirección en la ventana principal
            if (window.top) {
                window.top.location.href = url + params;
            } else {
                window.location.href = url + params;
            }
        }).getScriptUrl();
    });
</script>
