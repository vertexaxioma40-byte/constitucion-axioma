<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma - Centro de Mando</title>
    <style>
        :root {
            --azul-axioma: #00a3ff;
            --dorado-forense: #C5A059;
            --fondo-oscuro: #050a14;
            --tarjeta-oscura: #0a1120;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--fondo-oscuro);
            color: #ffffff;
            display: flex;
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            background: var(--tarjeta-oscura);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #1e2a44;
            box-shadow: 0 0 25px rgba(0, 163, 255, 0.15);
            text-align: center;
            max-width: 450px;
            width: 100%;
            margin-bottom: 30px;
        }
        h1 { font-size: 1.6rem; letter-spacing: 3px; margin-bottom: 5px; color: #ffffff; }
        h2 { margin-top: 0; margin-bottom: 20px; font-size: 0.8rem; color: var(--azul-axioma); text-transform: uppercase; letter-spacing: 1px; }
        
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: #000000;
            color: var(--azul-axioma);
            border: 1px solid #1e2a44;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            font-size: 1rem;
            outline: none;
        }

        #nombre_fiscal {
            font-size: 0.7rem;
            color: var(--dorado-forense);
            margin-bottom: 15px;
            min-height: 1.2rem;
            text-transform: uppercase;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .btn-carga { background-color: #002060; color: white; border: 1px solid var(--azul-axioma); }
        .btn-consulta { background-color: var(--dorado-forense); color: #050a14; margin-top: 10px; }
        .btn-vinculo { background-color: #00a3ff; color: white; margin-top: 15px; font-size: 0.7rem; }

        .file-zone {
            margin-top: 15px; 
            border: 1px dashed var(--azul-axioma); 
            padding: 15px; 
            border-radius: 8px;
            font-size: 0.8rem;
        }

        .footer { margin-top: 20px; font-size: 0.55rem; color: #444; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>VERTEX AXIOMA®</h1>
        <h2>Centro de Mando</h2>
        <input type="number" id="cuitInput" placeholder="DNI O CUIT (SIN GUIONES)" onblur="validarConARCA()">
        <div id="nombre_fiscal">ESPERANDO IDENTIFICACIÓN...</div>
        <input type="text" id="tokenInput" placeholder="INGRESE TOKEN VERTEX">
        
        <button class="btn-carga" onclick="ejecutarBarrido()">INICIAR BARRIDO DE NODOS</button>
        <button class="btn-vinculo" onclick="mostrarOnboarding()">VINCULAR DISPOSITIVO FORENSE</button>
    </div>

    <div class="container" id="seccion_onboarding" style="display:none; border: 2px solid var(--dorado-forense);">
        <h1>ALTA DE AGENTE</h1>
        <h2>Onboarding de Seguridad</h2>
        <input type="text" id="reg_nombre_agente" placeholder="NOMBRE COMPLETO DEL AGENTE">
        <div class="file-zone">
            CAPTURA BIOMÉTRICA (SELFIE EN VIVO):<br><br>
            <input type="file" id="selfieInput" accept="image/*" capture="user">
        </div>
        <button class="btn-vinculo" onclick="ejecutarOnboarding()">ENVIAR SOLICITUD DE ALTA</button>
    </div>

    <div class="container">
        <h1>REGISTRO VERTEX®</h1>
        <h2>Declaración de Activos</h2>
        <select id="tipoActivo" onchange="ajustarCamposActivo()">
            <option value="DRON">DRON / UNIDAD AÉREA</option>
            <option value="BALANZA">BALANZA / PESAJE</option>
            <option value="CAMION">TRANSPORTE / CAMIÓN</option>
            <option value="PDF_LEGAL">CONTRATO / PDF (MODO ABOGADO)</option>
        </select>
        
        <div id="camposActivo">
            <input type="text" id="idPrincipal" placeholder="N° DE SERIE / CHASIS">
            <input type="text" id="idSecundario" placeholder="MATRÍCULA / MOTOR">
        </div>

        <div class="file-zone" id="zonaEvidencia">
            EVIDENCIA (CAPTURA EN VIVO):<br><br>
            <input type="file" id="fileInput" accept="image/*" capture="camera">
        </div>
        
        <button class="btn-carga" onclick="subirYRegistrar()" style="background-color: #004d40;">EMITIR SELLO DE INMUTABILIDAD</button>
        <div class="footer">CONSTITUCIÓN AXIOMA® | PROTECCIÓN FORENSE</div>
    </div>

    <script>
    // REEMPLAZA ESTO CON TU URL DE GOOGLE APPS SCRIPT
    const urlNodo = "https://script.google.com/macros/s/AKfycbwb8leHLASqG0mf9DXXiD5JgAbzaK-3X4g30zgkyOf0wUT3LU5VMKlTzZY1PEbcjQY/exec";

    function mostrarOnboarding() {
        document.getElementById('seccion_onboarding').style.display = 'block';
        window.scrollTo(0, document.getElementById('seccion_onboarding').offsetTop);
    }

    function ajustarCamposActivo() {
        const tipo = document.getElementById('tipoActivo').value;
        const inputFiles = document.getElementById('fileInput');
        if (tipo === 'PDF_LEGAL') {
            inputFiles.removeAttribute('capture');
            inputFiles.accept = "application/pdf";
        } else {
            inputFiles.setAttribute('capture', 'camera');
            inputFiles.accept = "image/*";
        }
    }

    async function validarConARCA() {
        let id = document.getElementById('cuitInput').value;
        const visor = document.getElementById('nombre_fiscal');
        if(!id) return;
        visor.innerText = "SINCRONIZANDO CON NODO VERTEX...";
        
        try {
            const response = await fetch(urlNodo + "?cuit=" + id);
            const res = await response.json();
            if(res.exito) {
                visor.innerText = "✓ " + res.nombre;
                visor.style.color = "var(--dorado-forense)";
            } else {
                visor.innerText = "ERROR: IDENTIDAD NO LOCALIZADA";
                visor.style.color = "#ff4444";
            }
        } catch(e) { visor.innerText = "NODO FUERA DE LÍNEA"; }
    }

    async function ejecutarOnboarding() {
        const cuit = document.getElementById('cuitInput').value;
        const nombre = document.getElementById('reg_nombre_agente').value;
        const selfie = document.getElementById('selfieInput').files[0];

        if(!cuit || !selfie) { alert("DNI/CUIT y Selfie son obligatorios para el alta."); return; }

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = {
                accion: "ONBOARDING",
                cuit: cuit,
                nombre: nombre,
                selfieBase64: e.target.result,
                hardwareID: navigator.userAgent + "_" + screen.width + "x" + screen.height
            };
            enviarPost(data, "SOLICITUD DE ALTA ENVIADA. ESPERE VALIDACIÓN.");
        };
        reader.readAsDataURL(selfie);
    }

    function subirYRegistrar() {
        const f = document.getElementById('fileInput').files[0];
        const t = document.getElementById('tokenInput').value;
        const c = document.getElementById('cuitInput').value;
        
        if (!f || !c || !t) { alert("Evidencia, CUIT y Token son obligatorios."); return; }

        const reader = new FileReader();
        reader.onload = function(e) {
            const d = {
                accion: "REGISTRO_ACTIVO",
                identidad: c,
                token: t, 
                tipo: document.getElementById('tipoActivo').value,
                id_activo: document.getElementById('idPrincipal').value,
                id_secundario: document.getElementById('idSecundario').value,
                archivoBase64: e.target.result.split(',')[1],
                nombreArchivo: f.name,
                hardwareID: navigator.userAgent + "_" + screen.width
            };

            navigator.geolocation.getCurrentPosition((pos) => {
                d.gps = pos.coords.latitude + "," + pos.coords.longitude;
                enviarPost(d, "SELLO DE INMUTABILIDAD TRANSFRONTERIZA EMITIDO.");
            }, () => {
                enviarPost(d, "SELLO EMITIDO (Sin GPS - Alerta de Integridad).");
            });
        };
        reader.readAsDataURL(f);
    }

    function enviarPost(datos, mensaje) {
        fetch(urlNodo, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(datos)
        }).then(() => {
            alert(mensaje);
            location.reload();
        }).catch(err => alert("Error de Conexión: " + err));
    }

    function ejecutarBarrido() {
        alert("BARRIDO INICIADO: Escaneando integridad de nodos distribuidos...");
    }
    </script>
</body>
</html>
