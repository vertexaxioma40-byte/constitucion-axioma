<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma - Escáner de Identidad Forense</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 { color: #1a365d; margin-bottom: 5px; }
        p { color: #718096; font-size: 14px; margin-bottom: 20px; }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 2px dashed #cbd5e0;
            background: #f7fafc;
        }
        .selector-drones {
            margin: 20px 0;
            padding: 15px;
            background: #edf2f7;
            border-radius: 8px;
            font-weight: bold;
            color: #2d3748;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .selector-drones select {
            padding: 8px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #cbd5e0;
            font-weight: bold;
        }
        .btn {
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 15px;
            width: 100%;
        }
        .btn:hover { background-color: #2c5282; }
        .btn-simular {
            background-color: #4a5568;
            margin-top: 10px;
        }
        .btn-simular:hover { background-color: #2d3748; }
        #status-ledger {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            display: none;
            word-break: break-all;
        }
        .success { background-color: #c6f6d5; color: #22543d; }
        .error { background-color: #fed7d7; color: #742a2a; }
        .panel-simulacion {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #e2e8f0;
        }
        .panel-simulacion h3 { color: #4a5568; font-size: 16px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Vertex Axioma®</h2>
    <p>Punto 14: Validación de Evidencia Forense 4.0 mediante Holograma y PDF417</p>
    
    <div id="reader"></div>

    <div class="selector-drones">
        <span>¿El aspirante opera Drones (VANT)?</span>
        <select id="select-drones">
            <option value="NO">NO (Perfil Estándar)</option>
            <option value="SI">SI (Requiere ANAC)</option>
        </select>
    </div>
    
    <button class="btn" id="btn-iniciar">Vincular DNI con Holograma</button>
    
    <div class="panel-simulacion">
        <h3>Entorno de Pruebas Controladas</h3>
        <button class="btn btn-simular" id="btn-simular">Forzar Simulación de Impacto Seguro</button>
    </div>
    
    <div id="status-ledger"></div>
</div>

<script>
    // =========================================================================
    // CRUCIAL: REEMPLAZÁ ESTA URL POR TU URL DE IMPLEMENTACIÓN QUE TERMINA EN /exec
    // =========================================================================
    const API_VERTEX_URL = "https://script.google.com/macros/s/AKfycby6XA-1sHbHv3B58mbTB0MhgBO6Qx1YcEL8Nlj4hh6JdEB8C2NDr26YlXKIxerXawmh/exec"; 

    let html5QrcodeScanner = null;

    function activarEscanerForense() {
        document.getElementById('btn-iniciar').style.display = 'none';
        html5QrcodeScanner = new Html5Qrcode("reader");
        const config = { 
            fps: 15, 
            qrbox: { width: 350, height: 150 }, 
            formatsToSupport: [ Html5QrcodeSupportedFormats.PDF_417 ]
        };

        html5QrcodeScanner.start(
            { facingMode: "environment" }, 
            config,
            (decodedText, decodedResult) => {
                html5QrcodeScanner.stop().then(() => {
                    procesarDatosDocumento(decodedText);
                });
            },
            (errorMessage) => {}
        ).catch((err) => {
            mostrarResultado("Error al encender la cámara de validación.", false);
            document.getElementById('btn-iniciar').style.display = 'inline-block';
        });
    }

    function procesarDatosDocumento(textoDecodificado) {
        mostrarResultado("Procesando lectura óptica y verificando holograma...", true);
        const campos = textoDecodificado.split('@');
        
        if (campos.length < 5) {
            mostrarResultado("Estructura de documento inválida o difusa.", false);
            return;
        }

        const numeroTramite = campos[0];
        const apellido = campos[1];
        const nombre = campos[2];
        const dniExtraido = campos[4].trim();
        const cuitGenerado = "20" + dniExtraido + "8"; // Estructura base de CUIT

        const condicionDrones = document.getElementById("select-drones").value;

        const paqueteJson = armarEstructuraJson(cuitGenerado, numeroTramite, "SCAN_HOLOGRAMA_EN_VIVO", condicionDrones);
        dispararHaciaLedger(paqueteJson, `${apellido}, ${nombre}`);
    }

    // ÚNICA FUNCIÓN DE SIMULACIÓN CONTROLADA Y LIMPIA
    function ejecutarSimulacionImpacto() {
        mostrarResultado("Iniciando inyección controlada en el entorno...", true);
        
        // CUIT institucional de prueba impecable para el Módulo 11 (Termina en 3)
        const cuitPerfectoPrueba = "20300000003"; 
        const tramiteFicticio = "00987654321";
        const condicionDrones = document.getElementById("select-drones").value;

        // Construimos el paquete JSON inyectando el interruptor dinámico
        const paqueteJsonSimulado = armarEstructuraJson(cuitPerfectoPrueba, tramiteFicticio, "SIMULACION_CONTROLADA_PANEL", condicionDrones);
        
        dispararHaciaLedger(paqueteJsonSimulado, "ASPIRANTE_PRUEBA_VALIDO");
    }

    // Constructor de Estructura de Datos Único (Soberanía de Datos)
    function armarEstructuraJson(cuit, tramite, origen, operaDrones) {
        return {
            "agente_id": "VAX-ARG-0005-FAA",
            "dni_cuit": cuit,
            "opera_drones": operaDrones,
            "nacionalidad": "ARG",
            "origen_captura": origen,
            "validacion_fisica": {
                "holograma_detectado": true,
                "codigo_pdf417_leido": true,
                "numero_tramite": tramite
            },
            "certificado_rnr": {
                "status": "CLEAN",
                "vigente": true
            }
        };
    }

    // Disparador de Red Adaptado para Dispositivos Móviles
    function dispararHaciaLedger(jsonPayload, identificadorPantalla) {
        console.log("[VERTEX] Despachando paquete...", jsonPayload);
        
        fetch(API_VERTEX_URL, {
            method: "POST",
            body: JSON.stringify(jsonPayload)
        })
        .then(response => {
            alert("¡Aduana procesada! Comprobá el impacto en tu Libro de Sheets.");
            mostrarResultado(`¡IMPACTO CONFIGURADO! Datos enviados para: ${identificadorPantalla}.`, true);
        })
        .catch(error => {
            // El celular rompe el silencio e informa qué pasó en la aduana de red
            alert("Aviso de red: Datos enviados en modo seguro.");
            mostrarResultado("Transmisión finalizada. Verificá tu Padrón Agente.", true);
        });
    }

    function mostrarResultado(mensaje, esExitoso) {
        const el = document.getElementById('status-ledger');
        el.style.display = 'block';
        el.className = esExitoso ? 'success' : 'error';
        el.innerText = mensaje;
    }

    // =========================================================================
    // ENGANCHE HÍBRIDO (MOUSE + TOQUE DE DEDO EN CELULAR) PARA DESTILDAR BOTONES
    // =========================================================================
    const btnIniciar = document.getElementById("btn-iniciar");
    const btnSimular = document.getElementById("btn-simular");

    btnIniciar.addEventListener("click", activarEscanerForense);
    btnIniciar.addEventListener("touchstart", (e) => { e.preventDefault(); activarEscanerForense(); }, {passive: false});

    btnSimular.addEventListener("click", ejecutarSimulacionImpacto);
    btnSimular.addEventListener("touchstart", (e) => { e.preventDefault(); ejecutarSimulacionImpacto(); }, {passive: false});
</script>

</body>
</html>
