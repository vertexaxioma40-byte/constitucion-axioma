<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma | Acceso Blindado</title>
    <style>
        html, body { background-color: #050a15; color: #ffffff; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 0 20px; }
        .container { background: #0a1122; padding: 40px; border: 2px solid #002060; border-radius: 10px; box-shadow: 0 0 30px rgba(0, 32, 96, 0.6); width: 100%; max-width: 400px; text-align: center; }
        h1 { font-size: 1.8rem; letter-spacing: 3px; color: #ffffff; margin-bottom: 5px; }
        .subtitle { color: #4da6ff; font-size: 0.8rem; margin-bottom: 30px; display: block; text-transform: uppercase; }
        form { display: flex; flex-direction: column; gap: 15px; }
        label { font-size: 0.75rem; color: #4da6ff; text-align: left; text-transform: uppercase; font-weight: bold; }
        input { background: #000; border: 1px solid #4da6ff; color: #00ff00; padding: 15px; font-family: 'Courier New', monospace; text-align: center; font-size: 1.2rem; letter-spacing: 2px; }
        button { background: #002060; color: #fff; border: 1px solid #4da6ff; padding: 18px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #003399; box-shadow: 0 0 15px #4da6ff; }
        .status-msg { font-size: 0.7rem; color: #ff4d4d; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>VERTEX AXIOMA®</h1>
    <span class="subtitle">Protocolo de Integridad 4.0</span>
    
    <form id="access-form">
        <label>Ingrese su Token de Acceso</label>
        <input type="text" id="token" placeholder="TK-XXXX-XXXX" required>
        <button type="submit" id="submit-btn">VALIDAR IDENTIDAD</button>
    </form>
    
    <div id="error-msg" class="status-msg">TOKEN NO RECONOCIDO O INACTIVO</div>
</div>

<script>
    const form = document.getElementById('access-form');
    const btn = document.getElementById('submit-btn');
    const errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = document.getElementById('token').value.trim();
        
        btn.innerText = "VERIFICANDO...";
        btn.disabled = true;
        errorMsg.style.display = 'none';

        // GUARDAMOS EL TOKEN EN LOCALSTORAGE PARA LA TERMINAL
        localStorage.setItem('v_token', token);

        // REDIRIGIMOS A LA TERMINAL PASANDO EL TOKEN
        // La terminal será la encargada de hacer la llamada al script de Google
        window.location.href = `terminal.html?token=${token}`;
    });
</script>

</body>
</html>
