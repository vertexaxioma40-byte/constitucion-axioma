<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma - Centro de Mando</title>
    <style>
        :root {
            --azul-axioma: #00a3ff;
            --dorado-forense: #C5A059;
            --fondo-oscuro: #050a14;
            --tarjeta-oscura: #0a1120;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--fondo-oscuro);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--tarjeta-oscura);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #1e2a44;
            box-shadow: 0 0 25px rgba(0, 163, 255, 0.15);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { font-size: 1.8rem; letter-spacing: 3px; margin-bottom: 5px; color: #ffffff; }
        h2 { margin-top: 0; margin-bottom: 25px; font-size: 0.9rem; color: var(--azul-axioma); text-transform: uppercase; letter-spacing: 1px; }
        
        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: #000000;
            color: var(--azul-axioma);
            border: 1px solid #1e2a44;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            font-size: 1.1rem;
            outline: none;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .btn-carga {
            background-color: #002060;
            color: white;
            border: 1px solid var(--azul-axioma);
        }

        .btn-consulta {
            background-color: var(--dorado-forense);
            color: #050a14;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
            box-shadow: 0 5px 15px rgba(0, 163, 255, 0.2);
        }

        .footer { margin-top: 30px; font-size: 0.6rem; color: #444; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="container">
    <h1>VERTEX AXIOMA®</h1>
    <h2>Centro de Mando</h2>

    <input type="text" id="tokenInput" placeholder="INGRESE TOKEN VERTEX">

    <div class="btn-group">
        <button class="btn-carga" onclick="ejecutar('carga')">INICIAR BARRIDO DE NODOS</button>
        <button class="btn-consulta" onclick="ejecutar('consulta')">CONSULTAR ACTIVOS (HASH)</button>
    </div>

    <div class="footer">
        CONSTITUCIÓN AXIOMA® | PROTECCIÓN FORENSE
    </div>
</div>

<script>
    function ejecutar(accion) {
        const token = document.getElementById('tokenInput').value;
        const scriptURL = "https://script.google.com/macros/s/AKfycbx0jL32zwSV3rDeufVhsnAFVBbELET2dtyki28z8FKtN-bykOhus1FfO-87oauJcfM8/exec";

        if (!token) {
            alert("Acceso Denegado: Ingrese Token Vertex");
            return;
        }

        // Construcción de URL para Google Apps Script
        const finalURL = scriptURL + "?token=" + encodeURIComponent(token) + "&accion=" + accion;
        
        console.log("Conectando con el Nodo...");
        window.location.href = finalURL;
    }
</script>

</body>
</html>
