<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { background-color: #050a15; color: #00f2ff; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .container { border: 1px solid #00f2ff; padding: 25px; box-shadow: 0 0 20px #00f2ff; width: 320px; background: rgba(10, 17, 34, 0.9); }
    h2 { text-align: center; letter-spacing: 3px; font-size: 1.2rem; }
    input { width: 100%; background: transparent; border: none; border-bottom: 1px solid #00f2ff; color: white; margin: 15px 0; padding: 8px; font-family: 'Courier New', monospace; }
    button { width: 100%; background: #00f2ff; color: #050a15; border: none; padding: 12px; cursor: pointer; font-weight: bold; margin-top: 20px; transition: 0.3s; }
    button:hover { background: #fff; box-shadow: 0 0 10px #fff; }
  </style>
</head>
<body>
  <div class="container">
    <h2>NODO VERTEX</h2>
    <input type="text" id="nombre" placeholder="OPERADOR">
    <input type="email" id="email" placeholder="MAIL TÉCNICO">
    <input type="text" id="titular" placeholder="TITULAR / EMPRESA">
    <input type="email" id="mailEmpresa" placeholder="MAIL EMPRESA">
    <button onclick="entrar()">INGRESAR A TERMINAL</button>
  </div>

  <script>
    function entrar() {
      const d = {
        nombre: document.getElementById('nombre').value,
        email: document.getElementById('email').value,
        titular: document.getElementById('titular').value,
        mailEmpresa: document.getElementById('mailEmpresa').value
      };
      // Guardado crítico en memoria
      localStorage.setItem('v_datos', JSON.stringify(d));
      
      const url = window.location.href.split('?')[0];
      window.top.location.href = url + "?p=terminal";
    }
  </script>
</body>
</html>
