<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma - Centro de Mando</title>
    <style>
        :root {
            --azul-axioma: #00a3ff;
            --fondo-oscuro: #050a14;
            --tarjeta-oscura: #0a1120;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--fondo-oscuro);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--tarjeta-oscura);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #1e2a44;
            box-shadow: 0 0 25px rgba(0, 163, 255, 0.15);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { font-size: 2rem; letter-spacing: 3px; margin-bottom: 5px; color: #ffffff; }
        h2 { margin-top: 0; margin-bottom: 20px; font-size: 1rem; color: var(--azul-axioma); text-transform: uppercase; }
        
        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: #000000;
            color: var(--azul-axioma);
            border: 1px solid #1e2a44;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            font-size: 1.1rem;
        }
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            background-color: #002060;
            color: white;
            border: 1px solid var(--azul-axioma);
            text-transform: uppercase;
            transition: 0.3s;
        }
        button:hover { background-color: var(--azul-axioma); color: #000; }
        .footer { margin-top: 30px; font-size: 0.6rem; color: #444; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="container">
    <h1>VERTEX AXIOMA®</h1>
    <h2>Centro de Mando</h2>

    <input type="text" id="tokenInput" placeholder="INGRESE TOKEN">

    <button onclick="ejecutar('carga')">EJECUTAR BARRIDO DE NODOS</button>

    <div class="footer">
        CONSTITUCIÓN AXIOMA® | PROTECCIÓN FORENSE
    </div>
</div>

<script>
    function ejecutar(accion) {
        const token = document.getElementById('tokenInput').value;
        const scriptURL = "https://script.google.com/macros/s/AKfycbx8fE81OOgXPhwC7DmF1ThY57EQHsijVG_9VRNKNjJbE17aMQTCmqGSC-ZLvJ4punyA/exec";

        if (!token) {
            alert("Ingrese Token");
            return;
        }

        const finalURL = scriptURL + "?token=" + encodeURIComponent(token) + "&accion=" + accion;
        window.location.href = finalURL;
    }
</script>

</body>
</html>
