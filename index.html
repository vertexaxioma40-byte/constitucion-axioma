<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma - Nodo de Innovación</title>
</head>
<body style="background-color: #0d1117; color: #39ff14; font-family: 'Courier New', Courier, monospace; padding: 30px; line-height: 1.6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;">
    <div style="max-width: 600px; width: 100%; border: 1px solid #30363d; padding: 25px; border-radius: 8px; background: #161b22; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <h2 style="color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-top: 0;">🛡️ VERTEX AXIOMA®</h2>
        <p style="font-size: 0.8em; color: #8b949e; margin-bottom: 20px;">[NODO MORÓN - TRIBUNAL TECNOLÓGICO]</p>
        
        <div id="status-box" style="margin-bottom: 20px;">
            <p style="margin: 5px 0;"><strong>ESTADO:</strong> <span id="status-text" style="color: #e1e4e8;">INICIANDO PROTOCOLO...</span></p>
        </div>

        <div id="resultado" style="font-size: 0.85em; background: #0d1117; padding: 15px; border-radius: 4px; border-left: 4px solid #58a6ff; min-height: 100px; overflow-x: auto; white-space: pre-wrap;">
            Esperando datos de activos reales...
        </div>

        <div style="margin-top: 30px; border-top: 1px solid #30363d; pt: 15px;">
            <p style="font-size: 0.75em; color: #8b949e; text-align: center; margin-bottom: 5px;">
                <strong>Sello de Inmutabilidad Transfronteriza</strong>
            </p>
            <p style="font-size: 0.65em; color: #484f58; text-align: center; margin-top: 0;">
                Protocolo AXIOMA® - Auditoría 4.0 - Prueba Petrificada
            </p>
        </div>
    </div>

    <script>
        // Función para simular el Hash de Origen (DNA Digital)
        async function generarHash(mensaje) {
            const msgBuffer = new TextEncoder().encode(mensaje + Date.now());
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function ejecutarValidacion() {
            const statusText = document.getElementById('status-text');
            const resBox = document.getElementById('resultado');

            // Paso 1: Simulación de recepción
            setTimeout(() => {
                statusText.innerText = "GENERANDO DNA DIGITAL...";
                statusText.style.color = "#f1e05a";
            }, 1000);

            // Paso 2: Generación de ticket inmutable
            const dna = await generarHash("Certificación Vertex Axioma Real Assets");
            
            const ticket = {
                "entidad": "Vertex Axioma®",
                "nodo": "Morón, Buenos Aires",
                "punto_constitucion": "10. Sello de Inmutabilidad Transfronteriza",
                "metodo": "Prueba Petrificada (Auditoría 4.0)",
                "dna_digital": dna,
                "timestamp": new Date().toISOString(),
                "status": "VERIFICADO E INMUTABLE"
            };

            setTimeout(() => {
                statusText.innerText = "✅ PRUEBA PETRIFICADA";
                statusText.style.color = "#39ff14";
                resBox.style.borderLeftColor = "#39ff14";
                resBox.innerHTML = JSON.stringify(ticket, null, 4);
            }, 2500);
        }

        window.onload = ejecutarValidacion;
    </script>
</body>
</html>
