<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma | Terminal de Integridad</title>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background-color: #050a15; 
            color: #4da6ff; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 40px 20px;
        }
        .container { 
            background: #0a1122; 
            padding: 2.5rem; 
            border: 2px solid #002060; 
            border-radius: 8px; 
            box-shadow: 0 0 30px rgba(0, 32, 96, 0.5); 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            margin-bottom: 50px;
        }
        h1 { font-size: 1.8rem; border-bottom: 2px solid #002060; padding-bottom: 0.5rem; letter-spacing: 3px; color: #ffffff; }
        
        form { display: flex; flex-direction: column; gap: 1.2rem; margin-top: 20px; }
        input, select { 
            background: #000; border: 1px solid #002060; color: #ffffff; 
            padding: 0.9rem; border-radius: 4px; outline: none; font-family: 'Courier New', monospace; 
        }
        select { color: #4da6ff; cursor: pointer; }
        option { background: #0a1122; color: #ffffff; }

        button { 
            background: #002060; color: #ffffff; border: 1px solid #4da6ff; 
            padding: 1.1rem; cursor: pointer; font-weight: bold; border-radius: 4px; 
            text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
        }
        button:hover { background: #003399; box-shadow: 0 0 15px #4da6ff; }

        .constitucion-section { width: 100%; max-width: 900px; text-align: center; }
        .puntos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        .punto-card {
            background: rgba(0, 32, 96, 0.1);
            border: 1px solid #002060;
            padding: 15px;
            font-size: 0.75rem;
            text-align: left;
        }
        .punto-number { color: #ffffff; font-weight: bold; margin-right: 5px; }
        .footer-note { font-size: 0.7rem; margin-top: 50px; color: #002060; letter-spacing: 1px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>NODO VERTEX</h1>
    <p style="font-size: 0.8rem; font-weight: bold;">DESPACHO DE ACTIVOS DIGITALES</p>
    
    <form id="vertex-form">
        <input type="text" name="nombre" placeholder="NOMBRE COMPLETO" required>
        <input type="email" name="email" placeholder="EMAIL INSTITUCIONAL" required>
        
        <select name="documento" required>
            <option value="" disabled selected>SELECCIONAR ARCHIVO</option>
            <option value="integridad">REGLAMENTO DE INTEGRIDAD FORENSE</option>
            <option value="sello">MODELO SELLO TRANSFRONTERIZO</option>
            <option value="constitucion">CONSTITUCIÓN AXIOMA®</option>
            <option value="integracion">GUÍA DE INTEGRACIÓN TÉCNICA</option>
        </select>

        <button type="submit" id="submit-btn">SINCRONIZAR Y ENVIAR</button>
    </form>
</div>

<div class="constitucion-section">
    <h2 style="color:white; letter-spacing:3px;">CONSTITUCIÓN AXIOMA®</h2>
    <div class="puntos-grid">
        <div class="punto-card"><span class="punto-number">01.</span> Auditoría 4.0</div>
        <div class="punto-card"><span class="punto-number">06.</span> Prueba Petrificada</div>
        <div class="punto-card"><span class="punto-number">10.</span> Sello de Inmutabilidad Transfronteriza</div>
        <div class="punto-card"><span class="punto-number">16.</span> Sello de Conformidad Fiscal 4.0</div>
        <div class="punto-card"><span class="punto-number">12.</span> Soberanía de Datos</div>
        <div class="punto-card"><span class="punto-number">13.</span> Integridad de Datos</div>
    </div>
    <div class="footer-note">Sello de Inmutabilidad Transfronteriza | Vertex Axioma</div>
</div>

<script>
    const form = document.getElementById('vertex-form');
    const btn = document.getElementById('submit-btn');
    const scriptURL = 'TU_NUEVA_URL_DE_GOOGLE_SCRIPT_AQUI'; 

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.innerText = "PETRIFICANDO...";
        btn.disabled = true;

        fetch(scriptURL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: new FormData(form)
        });

        setTimeout(() => {
            window.location.href = 'gracias.html';
        }, 2500);
    });
</script>
</body>
</html>
