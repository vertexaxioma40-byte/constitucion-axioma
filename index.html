<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma | Nodo de Innovación</title>
    <style>
        html, body { 
            background-color: #050a15; 
            color: #ffffff; 
            margin: 0; padding: 0; 
            font-family: 'Courier New', monospace; 
        }
        body { display: flex; flex-direction: column; align-items: center; padding: 50px 20px; }
        .container { 
            background: #0a1122; 
            padding: 40px; 
            border: 2px solid #002060; 
            border-radius: 10px; 
            box-shadow: 0 0 30px rgba(0, 32, 96, 0.6); 
            width: 100%; max-width: 500px; text-align: center;
        }
        h1 { font-size: 1.8rem; letter-spacing: 3px; color: #ffffff; margin-bottom: 5px; }
        .subtitle { color: #4da6ff; font-size: 0.9rem; margin-bottom: 30px; display: block; }
        
        form { display: flex; flex-direction: column; gap: 20px; }
        label { font-size: 0.8rem; color: #4da6ff; text-align: left; text-transform: uppercase; }
        input, select { 
            background: #000; border: 1px solid #4da6ff; color: #fff; 
            padding: 15px; font-family: 'Courier New', monospace; 
        }
        button { 
            background: #002060; color: #fff; border: 1px solid #4da6ff; 
            padding: 18px; cursor: pointer; font-weight: bold; 
            text-transform: uppercase; transition: 0.3s;
        }
        button:hover { background: #003399; box-shadow: 0 0 15px #4da6ff; }
        .footer-text { font-size: 0.7rem; color: #4da6ff; margin-top: 20px; opacity: 0.7; }
    </style>
</head>
<body>

<div class="container">
    <h1>VERTEX AXIOMA®</h1>
    <span class="subtitle">Auditoría 4.0 & Integridad Forense</span>
    
    <form id="main-form">
        <label>Identificación de Acceso</label>
        <input type="text" name="nombre" id="nombre" placeholder="NOMBRE COMPLETO" required>
        <input type="email" name="email" id="email" placeholder="CORREO ELECTRÓNICO" required>
        
        <label>Documentación Requerida</label>
        <select name="documento" required>
            <option value="" disabled selected>SELECCIONE EL REPORTE...</option>
            <option value="constitucion">CONSTITUCIÓN AXIOMA® (Versión Blindada)</option>
            <option value="integridad">PROTOCOLO DE INTEGRIDAD FORENSE</option>
            <option value="sello">SELLO DE INMUTABILIDAD TRANSFRONTERIZA</option>
            <option value="integracion">GUÍA DE INTEGRACIÓN 4.0</option>
        </select>
        
        <button type="submit" id="submit-btn">SOLICITAR ACCESO AL NODO</button>
    </form>
    
    <p class="footer-text">Sincronizado con el Nodo Vertex</p>
</div>

<script>
    // URL de tu API de EXCEL (La que termina en /exec)
    const URL_EXCEL = "https://script.google.com/macros/s/AKfycbzFAVflsFHxqKiE_fjmoKVC6pl9U77dBa7-K71cIiXjq-tp9juBSFURh75I7-bN6qhBVg/exec";

    const form = document.getElementById('main-form');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.innerText = "SINCRONIZANDO...";
        btn.disabled = true;

        // Guardamos en memoria para que la Terminal lo recuerde
        const nombreVal = document.getElementById('nombre').value;
        const emailVal = document.getElementById('email').value;
        localStorage.setItem('vertex_nombre', nombreVal);
        localStorage.setItem('vertex_email', emailVal);

        const formData = new FormData(form);
        
        fetch(URL_EXCEL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: new URLSearchParams(formData) 
        })
        .then(() => {
            window.location.href = 'gracias.html';
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Error de conexión. Intente nuevamente.");
            btn.innerText = "REINTENTAR";
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
