<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma - Mesa de Entrada 4.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-secondary: #0d1117;
            --bg-card: #161b22;
            --accent-green: #00ff88;
            --accent-blue: #00e5ff;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        .logo-area span {
            color: var(--accent-green);
        }

        .system-badge {
            background-color: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            max-width: 650px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select {
            width: 100%;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: var(--accent-blue);
        }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 6px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            background-color: rgba(22, 27, 34, 0.5);
            transition: all 0.3s ease;
        }

        .drop-zone.drag-over {
            border-color: var(--accent-green);
            background-color: rgba(0, 255, 136, 0.05);
        }

        .drop-zone-icon {
            font-size: 2.5rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .drop-zone-text {
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .drop-zone-subtext {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 8px;
        }

        .btn-submit {
            width: 100%;
            background-color: transparent;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 15px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--accent-green);
            color: var(--bg-primary);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        /* Consola de Estado simulada */
        .console-output {
            margin-top: 25px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: none;
            max-height: 150px;
            overflow-y: auto;
        }

        .console-line {
            margin-bottom: 5px;
            line-height: 1.4;
        }

        .console-success { color: var(--accent-green); }
        .console-info { color: var(--accent-blue); }

        footer {
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 15px 40px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>VERTEX <span>AXIOMA®</span></h1>
        </div>
        <div class="system-badge">
            Mesa de Entrada 4.0
        </div>
    </header>

    <main>
        <div class="container">
            <div class="form-group">
                <label for="asset-type">Seleccione Tipo de Activo</label>
                <select id="asset-type">
                    <option value="catastro">Catastro Municipal & Planos de Edificación</option>
                    <option value="obra-publica">Obra Pública & Licitaciones</option>
                    <option value="energia">Energía & Activos Reales</option>
                    <option value="consorcios">Consorcios 4.0 & Liquidaciones</option>
                    <option value="forense">Paquete de Evidencia Forense Legal</option>
                </select>
            </div>

            <div class="form-group">
                <label>Ingesta de Archivos</label>
                <div class="drop-zone" id="dropZone">
                    <div class="drop-zone-icon">📁</div>
                    <div class="drop-zone-text" id="dropZoneText">Arrastre aquí el archivo o haga clic para explorar</div>
                    <div class="drop-zone-subtext">Formatos admitidos: PDF, DWG, BIM, JSON, DICOM</div>
                    <input type="file" id="fileInput" style="display: none;">
                </div>
            </div>

            <button class="btn-submit" id="btnSubmit">Iniciar Ingesta y Petrificación Universal</button>

            <div class="console-output" id="consoleOutput"></div>
        </div>
    </main>

    <footer>
        Ecosistema Blindado - Protocolo de Convergencia Forense Axioma - Confidencialidad Absoluta
    </footer>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const dropZoneText = document.getElementById('dropZoneText');
        const btnSubmit = document.getElementById('btnSubmit');
        const consoleOutput = document.getElementById('consoleOutput');
        let selectedFile = null;

        // Trigger input click
        dropZone.addEventListener('click', () => fileInput.click());

        // File Selection
        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Drag & Drop Handlers
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            if(e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        function handleFile(file) {
            selectedFile = file;
            dropZoneText.innerHTML = `<strong>Archivo cargado:</strong> ${file.name} (${(file.size/1024).toFixed(2)} KB)`;
            dropZone.style.borderColor = 'var(--accent-blue)';
        }

        // Simulación de Ingesta Criptográfica
        btnSubmit.addEventListener('click', () => {
            if(!selectedFile) {
                alert('Por favor, cargue un archivo primero para iniciar el protocolo.');
                return;
            }

            consoleOutput.style.display = 'block';
            consoleOutput.innerHTML = '';
            
            logLine('Iniciando pipeline de ingesta segura...', 'info');
            
            setTimeout(() => {
                // Generación de un hash simulado realista
                const mockHash = '0x' + Array.from({length: 64}, () => Math.floor(Math.random()*16).toString(16)).join('');
                logLine(`[OK] Archivo leído con éxito.`, 'success');
                logLine(`Calculando Hash de Origen (DNA Digital)...`, 'info');
                logLine(`SHA-256: ${mockHash}`, 'main');
            }, 800);

            setTimeout(() => {
                logLine(`Ejecutando orden de atomización forense en la red off-chain...`, 'info');
                logLine(`Distribuyendo fragmentos a Guardianes de la Tierra...`, 'info');
            }, 1800);

            setTimeout(() => {
                logLine(`Llamando función 'ingestarYPetrificarUniversal' en el Smart Contract V2...`, 'info');
                logLine(`Estado: Transacción confirmada en Bloque.`, 'success');
                logLine(`🔒 PRUEBA PETRIFICADA - Sello de Inmutabilidad Transfronteriza Activado.`, 'success');
            }, 3000);
        });

        function logLine(text, type) {
            const line = document.createElement('div');
            line.className = 'console-line';
            if(type === 'success') line.classList.add('console-success');
            if(type === 'info') line.classList.add('console-info');
            line.innerText = `> ${text}`;
            consoleOutput.appendChild(line);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
    </script>
</body>
</html>
