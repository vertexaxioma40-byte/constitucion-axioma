<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma | Terminal</title>
    <style>
        /* Forzamos el fondo oscuro y el color de texto para que nada se vea negro sobre negro */
        html, body { 
            background-color: #050a15 !important; 
            color: #ffffff !important; 
            margin: 0; 
            padding: 0; 
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .container { 
            background: #0a1122; 
            padding: 30px; 
            border: 2px solid #002060; 
            border-radius: 8px; 
            box-shadow: 0 0 20px rgba(0, 32, 96, 0.8); 
            width: 100%; 
            max-width: 450px; 
            text-align: center;
        }
        h1 { font-size: 1.6rem; color: #ffffff !important; margin: 0; }
        .nodo-sub { color: #4da6ff !important; font-size: 0.9rem; display: block; margin: 10px 0; }
        .divider { height: 1px; background: #002060; margin: 15px 0; }
        .protocolo { font-size: 1.2rem; color: #ffffff !important; font-weight: bold; }

        form { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
        input, select { 
            background: #000 !important; 
            border: 1px solid #4da6ff !important; 
            color: #ffffff !important; 
            padding: 12px; 
            font-family: 'Courier New', monospace;
        }
        button { 
            background: #002060; 
            color: #ffffff; 
            border: 1px solid #4da6ff; 
            padding: 15px; 
            cursor: pointer; 
            font-weight: bold;
            text-transform: uppercase;
        }
        button:hover { background: #003399; }
    </style>
</head>
<body>

<div class="container">
    <h1>VERTEX®</h1>
    <span class="nodo-sub">Nodo de Innovación & Capacitación</span>
    <div class="divider"></div>
    <div class="protocolo">Protocolo AXIOMA®</div>
    <p style="font-size: 0.7rem; color: #4da6ff;">TERMINAL DE INTEGRIDAD FORENSE</p>
    
    <form id="vertex-form">
        <input type="text" name="nombre" placeholder="NOMBRE COMPLETO" required>
        <input type="email" name="email" placeholder="EMAIL INSTITUCIONAL" required>
        <select name="documento" required>
            <option value="" disabled selected>SELECCIONE ACTIVO</option>
            <option value="integridad">Reglamento de Integridad Forense</option>
            <option value="sello">Modelo Sello Transfronterizo</option>
            <option value="constitucion">Constitución AXIOMA®</option>
            <option value="integracion">Guía de Integración Técnica</option>
        </select>
        <button type="submit" id="submit-btn">SINCRONIZAR Y ENVIAR</button>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwVnmZKUU5DUY_x_SUozhPrzDzASpndN1I5KfSeYsOkZ08hIQj2ELDUD-BS4nYJDpg9mg/exec';
    const form = document.getElementById('vertex-form');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.innerText = "PROCESANDO...";
        btn.disabled = true;
        fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: new FormData(form)})
        .then(() => { setTimeout(() => { window.location.href = 'gracias.html'; }, 2000); })
        .catch(() => { alert("Error de conexión"); btn.disabled = false; btn.innerText = "REINTENTAR"; });
    });
</script>

</body>
</html>
