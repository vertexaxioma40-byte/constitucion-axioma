<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma | Terminal de Integridad</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #0a0a0a; color: #00ff41; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { background: #1a1a1a; padding: 2.5rem; border: 1px solid #00ff41; border-radius: 8px; box-shadow: 0 0 25px rgba(0, 255, 65, 0.3); width: 100%; max-width: 400px; text-align: center; }
        h1 { font-size: 1.6rem; margin-bottom: 1rem; border-bottom: 2px solid #00ff41; padding-bottom: 0.5rem; letter-spacing: 2px; }
        p { font-size: 0.85rem; color: #aaa; margin-bottom: 1.5rem; text-transform: uppercase; }
        form { display: flex; flex-direction: column; gap: 1.2rem; }
        input { background: #000; border: 1px solid #00ff41; color: #00ff41; padding: 0.9rem; border-radius: 4px; outline: none; font-family: 'Courier New', monospace; }
        input::placeholder { color: #004411; }
        button { background: #00ff41; color: #000; border: none; padding: 1.1rem; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.3s; letter-spacing: 1px; }
        button:hover { background: #00cc33; box-shadow: 0 0 10px #00ff41; }
        button:disabled { background: #004411; color: #00ff41; cursor: not-allowed; opacity: 0.7; }
        .footer-note { font-size: 0.65rem; margin-top: 2rem; color: #333; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <h1>NODO VERTEX</h1>
    <p>Protocolo de Integridad Forense 4.0</p>
    
    <form id="vertex-form">
        <input type="text" name="nombre" placeholder="NOMBRE / CARGO ESTRATÉGICO" required>
        <input type="text" name="entidad" placeholder="ORGANISMO O EMPRESA" required>
        <input type="email" name="email" placeholder="EMAIL INSTITUCIONAL" required>
        
        <button type="submit" id="submit-btn">SOLICITAR ACCESO AL SELLO</button>
    </form>

    <div class="footer-note">
        PETRIFICACIÓN DE PRUEBA ACTIVA | SOBERANÍA DE DATOS <br>
        Sello de Inmutabilidad Transfronteriza
    </div>
</div>

<script>
document.getElementById('vertex-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('submit-btn');
    // URL ACTUALIZADA AL 13/03/2026 - IMPLEMENTACIÓN SZYvg
    const url = 'https://script.google.com/macros/s/AKfycbwmd7XZ4KxGGcdEWU_AdQFyFfEKD-iviEIsPrD3MVVK2UIyxd87h068eQtrmbXKQSZYvg/exec';
    
    btn.innerText = "SINCRONIZANDO NODO...";
    btn.disabled = true;

    const formData = new FormData(this);
    const data = {};
    formData.forEach((value, key) => { data[key] = value; });

    fetch(url, {
        method: 'POST',
        mode: 'no-cors', 
        body: JSON.stringify(data),
        headers: { 'Content-Type': 'text/plain' }
    });

    setTimeout(function() {
        window.location.href = 'gracias.html';
    }, 2500); // Subimos a 2.5 seg para asegurar que el mail se dispare
});
</script>

</body>
</html>
