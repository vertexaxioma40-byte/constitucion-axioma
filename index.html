<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma - Mesa de Entrada 4.0</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-secondary: #0d1117;
            --bg-card: #161b22;
            --accent-green: #00ff88;
            --accent-blue: #00e5ff;
            --accent-red: #ff4a4a;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- OVERLAY DE SEGURIDAD --- */
        .security-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(10, 12, 16, 0.98); backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }

        .security-card {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 40px; width: 100%; max-width: 420px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }

        .input-key {
            width: 100%; background-color: var(--bg-primary); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 15px; border-radius: 6px;
            text-align: center; letter-spacing: 3px; margin-bottom: 20px;
        }

        .btn-unlock {
            width: 100%; background: transparent; border: 1px solid var(--accent-blue);
            color: var(--accent-blue); padding: 12px; cursor: pointer; border-radius: 6px;
        }

        /* --- INTERFAZ --- */
        header { padding: 20px 40px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; }
        
        .container {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 8px; width: 100%; max-width: 650px; margin: 40px auto; padding: 40px;
        }

        .drop-zone {
            border: 2px dashed var(--border-color); border-radius: 6px;
            padding: 40px 20px; text-align: center; cursor: pointer;
            transition: all 0.3s ease;
        }

        .drop-zone.drag-over { border-color: var(--accent-green); background-color: rgba(0, 255, 136, 0.05); }

        .btn-submit {
            width: 100%; background: transparent; border: 1px solid var(--accent-green);
            color: var(--accent-green); padding: 15px; margin-top: 20px; cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background: rgba(0, 255, 136, 0.1);
        }

        .btn-certify {
            width: 100%; background: transparent; border: 1px solid var(--accent-blue);
            color: var(--accent-blue); padding: 15px; margin-top: 15px; cursor: pointer;
            display: none; /* Se revela solo tras petrificar el activo */
            transition: all 0.2s ease;
        }

        .btn-certify:hover {
            background: rgba(0, 229, 255, 0.1);
        }

        .console-output {
            margin-top: 25px; background-color: var(--bg-primary); border: 1px solid var(--border-color);
            padding: 15px; border-radius: 6px; font-size: 0.8rem; display: none;
        }
    </style>
</head>
<body>

    <div class="security-overlay" id="securityOverlay">
        <div class="security-card">
            <h2>SISTEMA ENCRIPTADO</h2>
            <input type="password" class="input-key" id="inputKey" placeholder="••••••••">
            <button class="btn-unlock" id="btnUnlock">Desbloquear Nodo</button>
        </div>
    </div>

    <header>
        <h1>VERTEX <span>AXIOMA®</span></h1>
        <div class="system-badge">Mesa de Entrada 4.0</div>
    </header>

    <main>
        <div class="container">
            <label>Tipo de Activo</label>
            <select id="asset-type" style="width: 100%; padding: 10px; margin-bottom: 20px; background: var(--bg-secondary); color: white; border: 1px solid var(--border-color);">
                <option value="catastro">Catastro Municipal</option>
                <option value="forense">Evidencia Forense Legal</option>
            </select>

            <div class="drop-zone" id="dropZone">
                <div id="dropZoneText">Arrastre aquí el archivo o haga clic</div>
                <input type="file" id="fileInput" style="display: none;">
            </div>

            <button class="btn-submit" id="btnSubmit">Iniciar Ingesta y Petrificación</button>
            
            <!-- NUEVO: Botón para generar el Certificado de Existencia (Punto #8) -->
            <button class="btn-certify" id="btnCertify">Generar Certificado de Existencia (Punto #8)</button>
            
            <div class="console-output" id="consoleOutput"></div>
        </div>
    </main>

<!-- ... (Mantén todo tu <head> y estilos iguales hasta la parte del <script>) ... -->
<script>
    const securityOverlay = document.getElementById('securityOverlay');
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const consoleOutput = document.getElementById('consoleOutput');
    const btnCertify = document.getElementById('btnCertify');
    let selectedFile = null;

    document.getElementById('btnUnlock').addEventListener('click', () => {
        securityOverlay.style.display = 'none';
    });

    document.getElementById('btnSubmit').addEventListener('click', () => {
        if(!selectedFile) return alert('Error: No se ha detectado activo.');
        
        const mockHash = "0x" + Array.from({length: 64}, () => Math.floor(Math.random()*16).toString(16)).join('');
        
        consoleOutput.style.display = 'block';
        consoleOutput.innerHTML = `
            <div style="color: var(--accent-green); border-left: 2px solid var(--accent-green); padding-left: 15px;">
                <div style="font-weight: bold; font-size: 1.1rem; margin-bottom: 5px;">SELLO DE INMUTABILIDAD TRANSFRONTERIZA</div>
                <div style="font-size: 0.8rem; margin-bottom: 10px; color: var(--accent-blue);">VALIDADO POR VERTEX AXIOMA®</div>
                <p style="font-size: 0.85rem; margin-bottom: 10px;">> DNA Digital generado con éxito.</p>
                <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 4px; margin-bottom: 10px;">
                    <strong style="font-size: 0.7rem; color: var(--text-muted);">PRUEBA PETRIFICADA (HASH):</strong><br>
                    <span id="generatedHash" style="font-family: monospace; font-size: 0.75rem; word-break: break-all;">${mockHash}</span>
                </div>
                <p style="font-size: 0.8rem;">> Estado: <strong>ENVIADO A LEDGER PÚBLICO</strong></p>
            </div>
        `;
        btnCertify.style.display = 'block';
    });

    // --- FUNCIÓN UNIFICADA: Imprimir y Registrar en Blockchain ---
    btnCertify.addEventListener('click', async () => {
        if(!selectedFile) return;

        // 1. Preparar datos
        const hashValue = document.getElementById('generatedHash').innerText;
        const assetTypeName = document.getElementById('asset-type').options[document.getElementById('asset-type').selectedIndex].text;

        // 2. Ejecutar la llamada al Puente (CMD)
        try {
            const respuesta = await fetch('http://localhost:3000/petrificar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ hash: hashValue })
            });
            const resultado = await respuesta.json();
            console.log("Respuesta del Puente:", resultado);
        } catch (error) {
            console.error("Error al conectar con el servidor local:", error);
            alert("Error: Asegúrate de tener el servidor 'bridge.js' ejecutándose en tu CMD.");
            return;
        }

        // 3. Abrir ventana de impresión
        const certWindow = window.open('', '_blank');
        certWindow.document.write(`
            <html><body><h1>CERTIFICADO DE EXISTENCIA DE ACTIVOS</h1><p>HASH: ${hashValue}</p><p>Activo: ${assetTypeName}</p></body></html>
        `);
        certWindow.document.close();
        certWindow.print();
    });

    // (Mantén aquí el resto de tu lógica de Drag & Drop)
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
    // ... (resto de funciones)
</script>
</body>
</html>
