<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vertex Axioma - Nodo de Integridad</title>
    <style>
        body { background-color: #0d1117; color: #39ff14; font-family: 'Courier New', monospace; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .nodo-container { border: 2px solid #30363d; padding: 40px; border-radius: 15px; max-width: 600px; background: #161b22; box-shadow: 0 0 30px rgba(0,0,0,0.5); text-align: center; }
        input, select { background: #0d1117; border: 1px solid #39ff14; color: #39ff14; padding: 12px; width: 90%; margin-bottom: 15px; border-radius: 5px; font-size: 1em; }
        button { background: #58a6ff; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; color: white; border-radius: 5px; width: 100%; font-size: 1.1em; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #39ff14; color: #0d1117; }
        .footer-points { font-size: 0.7em; color: #8b949e; margin-top: 25px; border-top: 1px solid #30363d; padding-top: 15px; }
        .legal { color: #39ff14; font-weight: bold; }
    </style>
</head>
<body>
    <div class="nodo-container">
        <h2 style="color: #58a6ff; margin-bottom: 5px;">🛡️ VERTEX AXIOMA®</h2>
        <p style="font-size: 0.9em; margin-bottom: 25px;">NODO DE INNOVACIÓN & CAPACITACIÓN</p>
        
        <form action="https://formspree.io/f/mojkwqzg" method="POST">
            <input type="text" name="entidad" placeholder="Entidad (Ej: AFIP / Empresa)" required>
            <input type="text" name="responsable" placeholder="Nombre del Responsable" required>
            <input type="email" name="email" placeholder="Correo Electrónico para el Sello" required>
            <select name="protocolo">
                <option value="Sello Conformidad Fiscal 4.0">Punto 16: Sello de Conformidad Fiscal 4.0</option>
                <option value="Inmutabilidad Transfronteriza">Punto 10: Sello de Inmutabilidad Transfronteriza</option>
            </select>
            <input type="hidden" name="_next" value="https://constitucion-axioma.onrender.com/VÉRTICE-AXIOMAr (1).pdf">
            <button type="submit">VALIDAR Y DESCARGAR CERTIFICADO</button>
        </form>

        <div class="footer-points">
            PROTOCOLOS ACTIVOS: <span class="legal">AUDITORÍA 4.0 | PUNTO 10 | PUNTO 16</span>
        </div>
    </div>
</body>
</html>
