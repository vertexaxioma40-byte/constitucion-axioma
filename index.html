<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma - Centro de Mando</title>
    <style>
        :root {
            --azul-axioma: #00a3ff;
            --azul-profundo: #002060;
            --dorado-forense: #C5A059;
            --fondo-oscuro: #050a14;
            --tarjeta-oscura: #0a1120;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--fondo-oscuro);
            color: #ffffff;
            display: flex;
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: var(--tarjeta-oscura);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #1e2a44;
            box-shadow: 0 0 25px rgba(0, 163, 255, 0.15);
            text-align: center;
            max-width: 450px;
            width: 100%;
            margin-bottom: 20px;
        }
        .hidden { display: none; }
        h1 { font-size: 1.6rem; letter-spacing: 3px; margin-bottom: 5px; color: #ffffff; }
        h2 { margin-top: 0; margin-bottom: 20px; font-size: 0.8rem; color: var(--azul-axioma); text-transform: uppercase; letter-spacing: 1px; }
        
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: #000000;
            color: var(--azul-axioma);
            border: 1px solid #1e2a44;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            font-size: 1rem;
            outline: none;
        }

        #nombre_fiscal {
            font-size: 0.75rem;
            color: var(--dorado-forense);
            margin-bottom: 15px;
            min-height: 1.2rem;
            text-transform: uppercase;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .btn-principal { background-color: var(--azul-profundo); color: white; border: 1px solid var(--azul-axioma); }
        .btn-principal:disabled { background-color: #1a1a1a; color: #444; border: 1px solid #333; cursor: not-allowed; }
        
        .btn-secundario { background-color: transparent; color: var(--azul-axioma); border: 1px solid var(--azul-axioma); font-size: 0.8rem; }
        .btn-dorado { background-color: var(--dorado-forense); color: #050a14; }

        .file-zone {
            margin: 15px 0; 
            border: 1px dashed var(--azul-axioma); 
            padding: 15px; 
            border-radius: 8px;
            font-size: 0.8rem;
            text-align: left;
            background: #000;
        }
        label { display: block; margin-bottom: 5px; color: var(--azul-axioma); font-weight: bold; }

        .footer { margin-top: 20px; font-size: 0.55rem; color: #444; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="container" id="panel_control">
        <h1>VERTEX AXIOMA®</h1>
        <h2>Consola de Mando</h2>
        
        <input type="number" id="cuitInput" placeholder="DNI O CUIT (SIN GUIONES)" onblur="validarIdentidad()">
        <div id="nombre_fiscal">ESPERANDO IDENTIFICACIÓN...</div>

        <button class="btn-secundario" onclick="mostrarAlta()">1. REGISTRAR ALTA DE AGENTE</button>

        <input type="password" id="tokenInput" placeholder="TOKEN DE SEGURIDAD" oninput="validarAccesoBarrido()">
        <button id="btnBarrido" class="btn-principal" disabled onclick="ejecutarBarrido()">2. BARRIDO DE NODOS (BLOQUEADO)</button>

        <button class="btn-dorado" onclick="mostrarRegistroActivos()">3. REGISTRO DE ACTIVOS</button>
    </div>

    <div class="container hidden" id="view_alta">
        <h1>ALTA AGENTE</h1>
        <h2>Legajo Forense 4.0</h2>
        <input type="text" id="reg_nombre" placeholder="NOMBRE COMPLETO">
        <input type="email" id="reg_mail" placeholder="EMAIL">
        <input type="tel" id="reg_tel" placeholder="CELULAR">
        
        <div class="file-zone">
            <label>DNI FRENTE/DORSO:</label>
            <input type="file" id="fileDni" accept="image/*">
        </div>
        <div class="file-zone">
            <label>SELFIE BIOMÉTRICA:</label>
            <input type="file" id="fileSelfie" accept="image/*" capture="user">
        </div>

        <button class="btn-principal" id="btnEnviarLegajo" onclick="enviarLegajo()">ENVIAR A AUDITORÍA</button>
        <button class="btn-secundario" onclick="volver()">VOLVER AL PANEL</button>
    </div>

    <div class="container hidden" id="view_activos">
        <h1>REGISTRO ACTIVOS</h1>
        <h2>Sello de Inmutabilidad</h2>
        <select id="tipoActivo">
            <option value="DRON">DRON / UNIDAD AÉREA</option>
            <option value="BALANZA">BALANZA / PESAJE</option>
            <option value="CAMION">TRANSPORTE / CAMIÓN</option>
        </select>
        <input type="text" id="idActivo" placeholder="SERIE / MATRÍCULA">
        <div class="file-zone">
            <label>EVIDENCIA EN VIVO:</label>
            <input type="file" id="fileActivo" accept="image/*" capture="camera">
        </div>
        <button class="btn-dorado" onclick="registrarActivo()">EMITIR SELLO</button>
        <button class="btn-secundario" onclick="volver()">VOLVER AL PANEL</button>
    </div>

    <div class="footer">CONSTITUCIÓN AXIOMA® | SEGURIDAD JURÍDICA DIGITAL</div>

    <script>
    function mostrarAlta() { toggleVistas('view_alta'); }
    function mostrarRegistroActivos() { toggleVistas('view_activos'); }
    function volver() { toggleVistas('panel_control'); }

    function toggleVistas(id) {
        document.getElementById('panel_control').classList.add('hidden');
        document.getElementById('view_alta').classList.add('hidden');
        document.getElementById('view_activos').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    }

    function validarAccesoBarrido() {
        const t = document.getElementById('tokenInput').value;
        const btn = document.getElementById('btnBarrido');
        if(t.length >= 4) {
            btn.disabled = false;
            btn.innerText = "2. INICIAR BARRIDO DE NODOS";
        } else {
            btn.disabled = true;
            btn.innerText = "2. BARRIDO (REQUIERE TOKEN)";
        }
    }

    async function enviarLegajo() {
        const btn = document.getElementById('btnEnviarLegajo');
        btn.innerText = "TRANSFERENCIA AL NODO...";
        btn.disabled = true;

        const getBase64 = (file) => new Promise((res) => {
            if (!file) res("");
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => res(reader.result.split(',')[1]);
        });

        const payload = {
            cuit: document.getElementById('cuitInput').value || "S_D",
            nombre: document.getElementById('reg_nombre').value,
            mail: document.getElementById('reg_mail').value,
            celular: document.getElementById('reg_tel').value,
            dniBase64: await getBase64(document.getElementById('fileDni').files[0]),
            cuitBase64: await getBase64(document.getElementById('fileCuit').files[0]),
            selfieBase64: await getBase64(document.getElementById('fileSelfie').files[0]),
            hardwareID: navigator.userAgent,
            rol: "PERITO_4.0"
        };

        google.script.run
            .withSuccessHandler(function(r) {
                if(r.exito) {
                    alert("✓ " + r.mensaje);
                    location.reload();
                } else {
                    alert("⚠ ATENCIÓN: " + r.mensaje);
                    btn.innerText = "REINTENTAR ENVÍO";
                    btn.disabled = false;
                }
            })
            .withFailureHandler(function(err) {
                alert("TIMEOUT: Los archivos son pesados o la conexión es lenta. Intente nuevamente.");
                btn.innerText = "ERROR DE CONEXIÓN";
                btn.disabled = false;
            })
            .procesoOnboardingAgente(payload);
    }

    function validarIdentidad() {
        /* Aquí va tu lógica de validación fetch o google.script.run a la base de datos */
    }
    function ejecutarBarrido() { alert("BARRIDO INICIADO..."); }
    function registrarActivo() { alert("REGISTRANDO ACTIVO..."); }
    </script>
</body>
</html>
