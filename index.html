<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma - Centro de Mando</title>
    <style>
        :root {
            --azul-axioma: #00a3ff;
            --dorado-forense: #C5A059;
            --fondo-oscuro: #050a14;
            --tarjeta-oscura: #0a1120;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--fondo-oscuro);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--tarjeta-oscura);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #1e2a44;
            box-shadow: 0 0 25px rgba(0, 163, 255, 0.15);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        .logo-box {
            height: 100px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img.logo {
            max-height: 100%;
            max-width: 220px;
        }
        h2 { margin-bottom: 5px; letter-spacing: 1px; font-size: 1.8rem; }
        p { color: #8892b0; font-size: 0.9rem; margin-bottom: 25px; }
        
        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: #000000;
            color: var(--azul-axioma);
            border: 1px solid #1e2a44;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            font-size: 1rem;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-carga { background-color: #002060; color: white; border: 1px solid var(--azul-axioma); }
        .btn-consulta { background-color: var(--dorado-forense); color: #050a14; }
        button:hover { transform: translateY(-2px); filter: brightness(1.2); box-shadow: 0 5px 15px rgba(0, 163, 255, 0.2); }
        .footer { margin-top: 30px; font-size: 0.65rem; color: #444; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-box">
        <img src="<img src="Logo.jpg" onerror="this.src='https://raw.githubusercontent.com/VeroArapian/Vertex-Axioma/main/Logo.jpg'" class="logo" style="max-width: 200px;">">
    </div>
    
    <h2>Centro de Mando</h2>
    <p>Protocolo de Integridad Forense 4.9</p>

    <input type="text" id="tokenInput" placeholder="Ingrese su Token Vertex">

    <div class="btn-group">
        <button class="btn-carga" onclick="ejecutar('carga')">INICIAR BARRIDO DE NODOS</button>
        <button class="btn-consulta" onclick="ejecutar('consulta')">CONSULTAR ACTIVOS</button>
    </div>

    <div class="footer">
        CONSTITUCIÓN AXIOMA® | PROTECCIÓN FORENSE
    </div>
</div>

<script>
    function ejecutar(accion) {
        const token = document.getElementById('tokenInput').value;
        
        // URL de tu Script de Google (ahora está protegida dentro del script)
        const scriptURL = "https://script.google.com/macros/s/AKfycbx8fE81OOgXPhwC7DmF1ThY57EQHsijVG_9VRNKNjJbE17aMQTCmqGSC-ZLvJ4punyA/exec";

        if (!token) {
            alert("Acceso Denegado: Ingrese Token Vertex");
            return;
        }

        // Redirección profesional
        const finalURL = `${scriptURL}?token=${token}&accion=${accion}`;
        window.location.href = finalURL;
    }
</script>

</body>
</html>
