<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { background-color: #050a15; color: #00f2ff; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .container { border: 1px solid #00f2ff; padding: 20px; box-shadow: 0 0 15px #00f2ff; width: 300px; }
    input { width: 100%; background: transparent; border: none; border-bottom: 1px solid #00f2ff; color: white; margin: 10px 0; padding: 5px; }
    button { width: 100%; background: #00f2ff; color: black; border: none; padding: 10px; cursor: pointer; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="text-align: center;">NODO VERTEX</h2>
    <input type="text" id="nombre" placeholder="OPERADOR">
    <input type="email" id="email" placeholder="MAIL TÉCNICO">
    <input type="text" id="idActivo" placeholder="ID ACTIVO">
    <button onclick="entrar()">INGRESAR A TERMINAL</button>
  </div>

  <script>
    function entrar() {
      const d = {
        nombre: document.getElementById('nombre').value,
        email: document.getElementById('email').value,
        idActivo: document.getElementById('idActivo').value
      };
      // Guardamos en memoria para la terminal
      localStorage.setItem('v_datos', JSON.stringify(d));
      window.location.href = window.location.href + (window.location.href.indexOf('?') > -1 ? '&p=terminal' : '?p=terminal');
    }
  </script>
</body>
</html>
