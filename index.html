<script>
    // URL de tu API de EXCEL (Asegurate que sea la /exec de la Nueva Implementación)
    const URL_EXCEL = "https://script.google.com/macros/s/AKfycbzFAVflsFHxqKiE_fjmoKVC6pl9U77dBa7-K71cIiXjq-tp9juBSFURh75I7-bN6qhBVg/exec";

    const form = document.getElementById('main-form');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.innerText = "SINCRONIZANDO...";
        btn.disabled = true;

        const formData = new FormData(form);
        
        // 1. GUARDAMOS EN LA MEMORIA ANTES DE ENVIAR
        const nombre = form.querySelector('input[name="nombre"]').value;
        const email = form.querySelector('input[name="email"]').value;
        localStorage.setItem('vertex_nombre', nombre);
        localStorage.setItem('vertex_email', email);
        
        // 2. ENVIAMOS AL NODO (EXCEL)
        fetch(URL_EXCEL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: new URLSearchParams(formData) 
        })
        .then(() => {
            // 3. ÉXITO: REDIRECCIÓN AL PUENTE
            window.location.href = 'gracias.html';
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Error de conexión con el Nodo Vertex.");
            btn.innerText = "REINTENTAR";
            btn.disabled = false;
        });
    });
</script>
