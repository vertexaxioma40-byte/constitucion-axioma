<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma | Terminal</title>
    <style>
        html, body { 
            background-color: #050a15 !important; 
            color: #ffffff !important; 
            margin: 0; 
            padding: 0; 
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .container { 
            background: #0a1122; 
            padding: 30px; 
            border: 2px solid #002060; 
            border-radius: 8px; 
            box-shadow: 0 0 20px rgba(0, 32, 96, 0.8); 
            width: 100%; 
            max-width: 450px; 
            text-align: center;
        }
        h1 { font-size: 1.6rem; color: #ffffff !important; margin: 0; }
        .nodo-sub { color: #4da6ff !important; font-size: 0.9rem; display: block; margin: 10px 0; }
        .divider { height: 1px; background: #002060; margin: 15px 0; }
        .protocolo { font-size: 1.2rem; color: #ffffff !important; font-weight: bold; }

        form { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
        input, select { 
            background: #000 !important; 
            border: 1px solid #4da6ff !important; 
            color: #ffffff !important; 
            padding: 12px; 
            font-family: 'Courier New', monospace;
        }
        button { 
            background: #002060; 
            color: #ffffff; 
            border: 1px solid #4da6ff; 
            padding: 15px; 
            cursor: pointer; 
            font-weight: bold;
            text-transform: uppercase;
        }
        button:hover { background: #003399; }
        button:disabled { background: #333; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h1>VERTEX®</h1>
    <span class="nodo-sub">Nodo de Innovación & Capacitación</span>
    <div class="divider"></div>
    <div class="protocolo">Protocolo AXIOMA®</div>
    <p style="font-size: 0.7rem; color: #4da6ff;">TERMINAL DE INTEGRIDAD FORENSE</p>
    
    <form id="vertex-form">
        <input type="text" name="nombre" placeholder="NOMBRE COMPLETO" required>
        <input type="email" name="email" placeholder="EMAIL INSTITUCIONAL" required>
        
        <div class="divider"></div>
        <input type="text" name="pureza" placeholder="PUREZA (Ej: 99.2%)" required>
        <input type="text" name="peso" placeholder="PESO/HUMEDAD (Ej: 12450kg)" required>
        <input type="text" name="coords" placeholder="GPS (Lat, Long)" required>

        <button type="submit" id="submit-btn">SINCRONIZAR Y GENERAR SELLO</button>
    </form>
</div>

<script>
    // URL de tu nueva API de Google Docs (la que genera el Sello Dinámico)
    const URL_API_CERTIFICACION = "https://script.google.com/macros/s/AKfycbz3vOxH5Qa-FDVurboBbhAOFAT4FF9djohbf33hEjp1rskrV540bdNBdjHoiSSnn3c6FQ/exec";
    
    const form = document.getElementById('vertex-form');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        btn.innerText = "PETRIFICANDO DATOS...";
        btn.disabled = true;

        // Capturamos los datos
        const formData = new FormData(form);
        
        // Enviamos a la API
        fetch(URL_API_CERTIFICACION, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: new URLSearchParams(formData)
        })
        .then(() => { 
            alert("🛡️ Sello de Inmutabilidad Generado. Revise su correo para descargar el PDF Petrificado.");
            btn.innerText = "SINCRONIZADO EXITOSAMENTE";
            form.reset();
        })
        .catch(err => { 
            console.error(err);
            alert("Error en la terminal forense."); 
            btn.disabled = false; 
            btn.innerText = "REINTENTAR"; 
        });
    });
</script>

</body>
</html>
