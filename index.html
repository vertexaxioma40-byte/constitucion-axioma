<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma - Escáner de Identidad Forense</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 { color: #1a365d; margin-bottom: 5px; }
        p { color: #718096; font-size: 14px; margin-bottom: 20px; }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 2px dashed #cbd5e0;
            background: #f7fafc;
        }
        .btn {
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 15px;
            width: 100%;
        }
        .btn:hover { background-color: #2c5282; }
        .btn-simular {
            background-color: #4a5568;
            margin-top: 10px;
        }
        .btn-simular:hover { background-color: #2d3748; }
        #status-ledger {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }
        .success { background-color: #c6f6d5; color: #22543d; }
        .error { background-color: #fed7d7; color: #742a2a; }
        .panel-simulacion {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #e2e8f0;
        }
        .panel-simulacion h3 { color: #4a5568; font-size: 16px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Vertex Axioma®</h2>
    <p>Punto 14: Validación de Evidencia Forense 4.0 mediante Holograma y PDF417</p>
    
    <div id="reader"></div>
    
    <button class="btn" id="btn-iniciar" onclick="activarEscanerForense()">Vincular DNI con Holograma</button>
    
    <div class="panel-simulacion">
        <h3>Entorno de Pruebas Controladas</h3>
        <button class="btn btn-simular" onclick="ejecutarSimulacionImpacto()">Forzar Simulación de Impacto Seguro</button>
    </div>
    
    <div id="status-ledger"></div>
</div>

<script>
    // ==========================================
    // COLOCÁ TU URL ESTRATÉGICA DE APPS SCRIPT ACÁ
    // ==========================================
    const API_VERTEX_URL = "https://script.google.com/macros/library/d/1NA87oewrKY6q9bVLKBUAnBjTNkxUVCK5av6T_PCXifAvFSm-mHc0_Z-w/180"; 

    function activarEscanerForense() {
        document.getElementById('btn-iniciar').style.display = 'none';
        const html5QrcodeScanner = new Html5Qrcode("reader");
        const config = { 
            fps: 15, 
            qrbox: { width: 350, height: 150 }, 
            formatsToSupport: [ Html5QrcodeSupportedFormats.PDF_417 ]
        };

        html5QrcodeScanner.start(
            { facingMode: "environment" }, 
            config,
            (decodedText, decodedResult) => {
                html5QrcodeScanner.stop().then(() => {
                    procesarDatosDocumento(decodedText);
                });
            },
            (errorMessage) => {}
        ).catch((err) => {
            mostrarResultado("Error al encender la cámara de validación.", false);
            document.getElementById('btn-iniciar').style.display = 'inline-block';
        });
    }

    function procesarDatosDocumento(textoDecodificado) {
        mostrarResultado("Procesando lectura óptica y verificando holograma...", true);
        const campos = textoDecodificado.split('@');
        
        if (campos.length < 5) {
            mostrarResultado("Estructura de documento inválida o difusa.", false);
            return;
        }

        const numeroTramite = campos[0];
        const apellido = campos[1];
        const nombre = campos[2];
        const dniExtraido = campos[4].trim();
        const cuitSimulado = "20" + dniExtraido + "8"; 

        const paqueteJson = armarEstructuraJson(cuitSimulado, numeroTramite, "SCAN_HOLOGRAMA_EN_VIVO");
        dispararHaciaLedger(paqueteJson, `${apellido}, ${nombre}`);
    }

    // ==========================================
    // FUNCIÓN DE SIMULACIÓN INMEDIATA
    // ==========================================
    function ejecutarSimulacionImpacto() {
        mostrarResultado("Iniciando inyección controlada en el entorno...", true);
        
        // Generamos datos ficticios aleatorios pero con estructura real y limpia
        const numeroFicticioDni = Math.floor(10000000 + Math.random() * 90000000); // DNI de 8 dígitos aleatorio
        const cuitSimuladoValido = "20" + numeroFicticioDni + "8"; // Estructura de CUIT
        const tramiteFicticio = Math.floor(10000000000 + Math.random() * 90000000000).toString();

        // Armamos el paquete emulado
        const paqueteJsonSimulado = armarEstructuraJson(cuitSimuladoValido, tramiteFicticio, "SIMULACION_CONTROLADA_PANEL");
        
        // Ejecutamos el disparo
        dispararHaciaLedger(paqueteJsonSimulado, `ASPIRANTE_SIMULADO_${numeroFicticioDni}`);
    }

    // Constructor de Estructura de Datos (Soberanía de Datos)
    function armarEstructuraJson(cuit, tramite, origen) {
        return {
            "agente_id": "VAX-ARG-0005-FAA",
            "dni_cuit": cuit,
            "nacionalidad": "ARG",
            "origen_captura": origen,
            "validacion_fisica": {
                "holograma_detectado": true,
                "codigo_pdf417_leido": true,
                "numero_tramite": tramite
            },
            "certificado_rnr": {
                "status": "CLEAN",
                "vigente": true
            }
        };
    }

    // Disparador de Red Criptográfico/Forense (POST)
    function dispararHaciaLedger(jsonPayload, identificadorPantalla) {
        fetch(API_VERTEX_URL, {
            method: "POST",
            mode: "no-cors", 
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(jsonPayload)
        })
        .then(() => {
            mostrarResultado(`¡IMPACTO PERFECTO! Registro petrificado en tu Google Sheet para: ${identificadorPantalla}.`, true);
        })
        .catch(error => {
            mostrarResultado("Fallo en la transmisión de red hacia el Ledger.", false);
        });
    }

    function mostrarResultado(mensaje, esExitoso) {
        const el = document.getElementById('status-ledger');
        el.style.display = 'block';
        el.className = esExitoso ? 'success' : 'error';
        el.innerText = mensaje;
    }
</script>

</body>
</html>
