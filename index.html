<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma - Mesa de Entrada 4.0</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-secondary: #0d1117;
            --bg-card: #161b22;
            --accent-green: #00ff88;
            --accent-blue: #00e5ff;
            --accent-red: #ff4a4a;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- OVERLAY DE SEGURIDAD --- */
        .security-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(10, 12, 16, 0.98); backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }

        .security-card {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 40px; width: 100%; max-width: 420px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }

        .input-key {
            width: 100%; background-color: var(--bg-primary); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 15px; border-radius: 6px;
            text-align: center; letter-spacing: 3px; margin-bottom: 20px;
        }

        .btn-unlock {
            width: 100%; background: transparent; border: 1px solid var(--accent-blue);
            color: var(--accent-blue); padding: 12px; cursor: pointer; border-radius: 6px;
        }

        /* --- INTERFAZ --- */
        header { padding: 20px 40px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; }
        
        .container {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 8px; width: 100%; max-width: 650px; margin: 40px auto; padding: 40px;
        }

        .drop-zone {
            border: 2px dashed var(--border-color); border-radius: 6px;
            padding: 40px 20px; text-align: center; cursor: pointer;
            transition: all 0.3s ease;
        }

        .drop-zone.drag-over { border-color: var(--accent-green); background-color: rgba(0, 255, 136, 0.05); }

        .btn-submit {
            width: 100%; background: transparent; border: 1px solid var(--accent-green);
            color: var(--accent-green); padding: 15px; margin-top: 20px; cursor: pointer;
        }

        .console-output {
            margin-top: 25px; background-color: var(--bg-primary); border: 1px solid var(--border-color);
            padding: 15px; border-radius: 6px; font-size: 0.8rem; display: none;
        }
    </style>
</head>
<body>

    <div class="security-overlay" id="securityOverlay">
        <div class="security-card">
            <h2>SISTEMA ENCRIPTADO</h2>
            <input type="password" class="input-key" id="inputKey" placeholder="••••••••">
            <button class="btn-unlock" id="btnUnlock">Desbloquear Nodo</button>
        </div>
    </div>

    <header>
        <h1>VERTEX <span>AXIOMA®</span></h1>
        <div class="system-badge">Mesa de Entrada 4.0</div>
    </header>

    <main>
        <div class="container">
            <label>Tipo de Activo</label>
            <select id="asset-type" style="width: 100%; padding: 10px; margin-bottom: 20px; background: var(--bg-secondary); color: white;">
                <option value="catastro">Catastro Municipal</option>
                <option value="forense">Evidencia Forense Legal</option>
            </select>

            <div class="drop-zone" id="dropZone">
                <div id="dropZoneText">Arrastre aquí el archivo o haga clic</div>
                <input type="file" id="fileInput" style="display: none;">
            </div>

            <button class="btn-submit" id="btnSubmit">Iniciar Ingesta y Petrificación</button>
            <div class="console-output" id="consoleOutput"></div>
        </div>
    </main>

    <script>
    const securityOverlay = document.getElementById('securityOverlay');
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const consoleOutput = document.getElementById('consoleOutput');
    let selectedFile = null;

    // 1. Lógica de Desbloqueo
    document.getElementById('btnUnlock').addEventListener('click', () => {
        securityOverlay.style.display = 'none';
    });

    // 2. Lógica de Submit (Prueba Petrificada)
    document.getElementById('btnSubmit').addEventListener('click', () => {
        if(!selectedFile) return alert('Error: No se ha detectado activo.');
        
        // Generar un hash simulado para el DNA Digital
        const mockHash = "0x" + Array.from({length: 64}, () => Math.floor(Math.random()*16).toString(16)).join('');
        
        consoleOutput.style.display = 'block';
        consoleOutput.innerHTML = `
            <div style="color: var(--accent-green); border-left: 2px solid var(--accent-green); padding-left: 10px;">
                > Iniciando Sello de Inmutabilidad Transfronteriza...<br>
                > DNA Digital generado con éxito.<br>
                <br>
                <strong>PRUEBA PETRIFICADA (HASH):</strong><br>
                <span style="font-size: 0.75rem; word-break: break-all;">${mockHash}</span><br>
                <br>
                > Estado: <strong>ENVIADO A LEDGER PÚBLICO</strong><br>
                > Auditor: Arapian 4.0
            </div>
        `;
    });

    // 3. Manejo de Archivos
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
    
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if(e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
        selectedFile = file;
        dropZone.innerHTML = `<strong>Archivo listo:</strong> ${file.name}`;
        dropZone.style.borderColor = 'var(--accent-green)';
    }
</script>
</body>
</html>
