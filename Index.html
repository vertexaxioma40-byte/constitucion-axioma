<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma - Centro de Mando</title>
    <style>
        :root {
            --azul-axioma: #00a3ff;
            --dorado-forense: #C5A059;
            --fondo-oscuro: #050a14;
            --tarjeta-oscura: #0a1120;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--fondo-oscuro);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--tarjeta-oscura);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #1e2a44;
            box-shadow: 0 0 25px rgba(0, 163, 255, 0.15);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { font-size: 1.8rem; letter-spacing: 3px; margin-bottom: 5px; color: #ffffff; }
        h2 { margin-top: 0; margin-bottom: 25px; font-size: 0.9rem; color: var(--azul-axioma); text-transform: uppercase; letter-spacing: 1px; }
        
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            background: #000000;
            color: var(--azul-axioma);
            border: 1px solid #1e2a44;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            font-size: 1.1rem;
            outline: none;
        }

        /* Estilo para el visor de nombre fiscal */
        #nombre_fiscal {
            font-size: 0.75rem;
            color: var(--dorado-forense);
            margin-bottom: 20px;
            min-height: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .btn-carga {
            background-color: #002060;
            color: white;
            border: 1px solid var(--azul-axioma);
        }

        .btn-consulta {
            background-color: var(--dorado-forense);
            color: #050a14;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
            box-shadow: 0 5px 15px rgba(0, 163, 255, 0.2);
        }

        .footer { margin-top: 30px; font-size: 0.6rem; color: #444; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="container">
    <h1>VERTEX AXIOMA®</h1>
    <h2>Centro de Mando</h2>

    <input type="number" id="cuitInput" placeholder="INGRESE CUIT (SIN GUIONES)" onblur="validarConARCA()">
    <div id="nombre_fiscal">ESPERANDO IDENTIFICACIÓN...</div>

    <input type="text" id="tokenInput" placeholder="INGRESE TOKEN VERTEX">

    <div class="btn-group">
        <button class="btn-carga" onclick="ejecutar('carga')">INICIAR BARRIDO DE NODOS</button>
        <button class="btn-consulta" onclick="ejecutar('consulta')">CONSULTAR ACTIVOS (HASH)</button>
    </div>

    <div class="footer">
        CONSTITUCIÓN AXIOMA® | PROTECCIÓN FORENSE
    </div>
</div>

<script>
    // Función para validar CUIT con el Padrón de ARCA (Ex-AFIP)
    function validarConARCA() {
        const cuit = document.getElementById('cuitInput').value;
        const visor = document.getElementById('nombre_fiscal');
        
        if(cuit.length < 11) return;
        
        visor.innerText = "VERIFICANDO EN PADRÓN ARCA...";
        
        // Llama a la función que pegaste en el Código.gs
        google.script.run.withSuccessHandler(res => {
            if(res.exito) {
                visor.innerText = "✓ " + res.nombre;
                visor.style.color = "var(--dorado-forense)";
            } else {
                visor.innerText = "ERROR: IDENTIDAD NO LOCALIZADA";
                visor.style.color = "#ff4444";
            }
        }).consultarPadronARCA(cuit);
    }

    function ejecutar(accion) {
        const token = document.getElementById('tokenInput').value;
        const cuit = document.getElementById('cuitInput').value;
        const scriptURL = "/**
 * Consulta el Padrón o permite Identidad Manual (Punto 16)
 */
function consultarPadronARCA(cuit) {
  const cuitLimpio = cuit.toString().replace(/-/g, "");
  
  // Si es un DNI (menos de 11 dígitos), lo tomamos como Identidad Manual
  if (cuitLimpio.length < 10) {
    return {
      exito: true,
      nombre: "IDENTIDAD MANUAL: " + cuitLimpio,
      condicion: "FUERA_DE_PADRON",
      cuit: cuitLimpio
    };
  }

  const url = "https://api.apis.net.pe/v1/ruc?numero=" + cuitLimpio; 
  try {
    const response = UrlFetchApp.fetch(url);
    const data = JSON.parse(response.getContentText());
    
    if (data && data.nombre) {
      return { exito: true, nombre: data.nombre, condicion: data.estado, cuit: cuitLimpio };
    } else {
      // Fallback: Si no está en ARCA, permitimos que pase igual con su número
      return { exito: true, nombre: "ID NO REGISTRADA: " + cuitLimpio, condicion: "S/C", cuit: cuitLimpio };
    }
  } catch (e) {
    // Si la API falla o no lo encuentra, no bloqueamos al usuario
    return { exito: true, nombre: "IDENTIDAD LOCAL: " + cuitLimpio, cuit: cuitLimpio };
  }
}";

        if (!cuit || !token) {
            alert("ACCESO DENEGADO: Identidad y Token requeridos.");
            return;
        }

        // Construcción de URL con los nuevos parámetros de triple verificación
        const finalURL = scriptURL + 
                         "?token=" + encodeURIComponent(token) + 
                         "&cuit=" + encodeURIComponent(cuit) +
                         "&accion=" + accion;
        
        console.log("Sincronizando con Nodo Vertex...");
        window.location.href = finalURL;
    }
</script>

</body>
</html>
