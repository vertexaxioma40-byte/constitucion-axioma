<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vertex Axioma | Solicitud Registrada</title>
    <style>
        /* ESTÉTICA AZUL COBALTO FORENSE */
        body { 
            font-family: 'Courier New', monospace; 
            background-color: #050a15; 
            color: #4da6ff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center; 
            overflow: hidden; 
        }
        .box { 
            border: 2px solid #002060; 
            padding: 3rem; 
            background: #0a1122; 
            box-shadow: 0 0 30px rgba(0, 32, 96, 0.6); 
            border-radius: 10px; 
            max-width: 500px; 
        }
        h1 { 
            font-size: 1.8rem; 
            letter-spacing: 4px; 
            border-bottom: 2px solid #002060; 
            padding-bottom: 1rem; 
            margin-top: 0; 
            color: #ffffff;
        }
        .status { 
            color: #4da6ff; 
            font-size: 0.9rem; 
            margin-bottom: 20px; 
            text-transform: uppercase; 
            font-weight: bold;
            letter-spacing: 1px;
        }
        /* LOADER SINCRONIZADO EN AZUL */
        .loader { 
            margin: 30px auto; 
            border: 4px solid #001533; 
            border-top: 4px solid #4da6ff; 
            border-radius: 50%; 
            width: 60px; 
            height: 60px; 
            animation: spin 0.8s linear infinite; 
            box-shadow: 0 0 10px rgba(77, 166, 255, 0.3);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        p { font-size: 1.1rem; line-height: 1.6; color: #8bbfff; }
        
        /* BOTÓN DE RETORNO */
        .back-link { 
            margin-top: 30px; 
            display: inline-block; 
            color: #ffffff; 
            background: #002060; 
            padding: 12px 25px; 
            text-decoration: none; 
            font-weight: bold; 
            border: 1px solid #4da6ff;
            border-radius: 4px; 
            transition: 0.3s; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .back-link:hover { 
            background: #003399; 
            box-shadow: 0 0 15px #4da6ff; 
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>SOLICITUD REGISTRADA</h1>
        <div class="status">Protocolo de Integridad Forense 4.0 Activo</div>
        <div class="loader"></div>
        <p>Sincronizando con el Sello de Inmutabilidad Transfronteriza...</p>
        <p>Sus datos han sido petrificados en el Nodo Vertex.</p>
        <a href="index.html" class="back-link">VOLVER AL INICIO</a>
    </div>
</body>
</html>
