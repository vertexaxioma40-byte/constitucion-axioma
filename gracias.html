<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vertex Axioma | Solicitud Registrada</title>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #0a0a0a; color: #00ff41; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; overflow: hidden; }
        .box { border: 1px solid #00ff41; padding: 3rem; background: #1a1a1a; box-shadow: 0 0 30px rgba(0, 255, 65, 0.4); border-radius: 10px; max-width: 500px; }
        h1 { font-size: 1.8rem; letter-spacing: 4px; border-bottom: 2px solid #00ff41; padding-bottom: 1rem; margin-top: 0; }
        .status { color: #888; font-size: 0.9rem; margin-bottom: 20px; text-transform: uppercase; }
        .loader { margin: 30px auto; border: 4px solid #002200; border-top: 4px solid #00ff41; border-radius: 50%; width: 60px; height: 60px; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { font-size: 1.1rem; line-height: 1.6; }
        .back-link { margin-top: 30px; display: inline-block; color: #000; background: #00ff41; padding: 12px 25px; text-decoration: none; font-weight: bold; border-radius: 4px; transition: 0.3s; }
        .back-link:hover { background: #00cc33; box-shadow: 0 0 15px #00ff41; }
    </style>
</head>
<body>
    <div class="box">
        <h1>SOLICITUD REGISTRADA</h1>
        <div class="status">Protocolo de Integridad Forense 4.0 Activo</div>
        <div class="loader"></div>
        <p>Sincronizando con el Sello de Inmutabilidad Transfronteriza...</p>
        <p>Sus datos han sido petrificados en el Nodo Vertex.</p>
        <a href="index.html" class="back-link">VOLVER AL INICIO</a>
    </div>
</body>
</html>
