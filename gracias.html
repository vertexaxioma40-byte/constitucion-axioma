<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vertex Axioma | Fase de Sincronización</title>
    <style>
        /* ESTÉTICA AZUL COBALTO FORENSE */
        body { 
            font-family: 'Courier New', monospace; 
            background-color: #050a15; 
            color: #4da6ff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center; 
            overflow: hidden; 
        }
        .box { 
            border: 2px solid #002060; 
            padding: 3rem; 
            background: #0a1122; 
            box-shadow: 0 0 30px rgba(0, 32, 96, 0.6); 
            border-radius: 10px; 
            max-width: 550px; 
        }
        h1 { 
            font-size: 1.8rem; 
            letter-spacing: 4px; 
            border-bottom: 2px solid #002060; 
            padding-bottom: 1rem; 
            margin-top: 0; 
            color: #ffffff;
        }
        .status { 
            color: #4da6ff; 
            font-size: 0.9rem; 
            margin-bottom: 20px; 
            text-transform: uppercase; 
            font-weight: bold;
            letter-spacing: 1px;
        }
        .loader { 
            margin: 20px auto; 
            border: 4px solid #001533; 
            border-top: 4px solid #4da6ff; 
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            animation: spin 0.8s linear infinite; 
            box-shadow: 0 0 10px rgba(77, 166, 255, 0.3);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        p { font-size: 1rem; line-height: 1.6; color: #8bbfff; }
        
        /* BOTONES DE ACCIÓN */
        .btn-container {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .primary-link { 
            display: inline-block; 
            color: #ffffff; 
            background: #002060; 
            padding: 15px 25px; 
            text-decoration: none; 
            font-weight: bold; 
            border: 1px solid #4da6ff;
            border-radius: 4px; 
            transition: 0.3s; 
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(77, 166, 255, 0.2);
        }
        .primary-link:hover { 
            background: #4da6ff; 
            color: #050a15;
            box-shadow: 0 0 20px #4da6ff; 
        }
        .secondary-link {
            color: #4da6ff;
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
        }
        .secondary-link:hover { opacity: 1; }
    </style>
</head>
<body>
    <div class="box">
        <h1>REGISTRO EXITOSO</h1>
        <div class="status">Nodo Vertex: Identidad Verificada</div>
        <div class="loader"></div>
        <p>Su solicitud de documento ha sido procesada bajo el Protocolo AXIOMA®.</p>
        <p><strong>¿Desea validar la inmutabilidad de un activo real en tiempo real?</strong></p>
        
        <div class="btn-container">
            <a href="terminal.html" class="primary-link">INICIAR SIMULACIÓN DE CARGA 4.0</a>
            
            <a href="index.html" class="secondary-link">Volver al Inicio</a>
        </div>
    </div>
</body>
</html>
