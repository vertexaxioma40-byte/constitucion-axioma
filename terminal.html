<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma | Terminal de Operaciones</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #050a15; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe id="nodo-vertex" src="" style="width: 100%; height: 100%; border: none;"></iframe>

    <script>
        window.onload = function() {
            // PEGA TU URL DE GOOGLE (LA QUE TERMINA EN /exec) AQUÍ ABAJO
            const urlGoogle = "TU_URL_DE_GOOGLE_AQUI";
            
            const params = window.location.search;
            // Construimos la URL para que Google sepa que tiene que mostrar la terminal
            const finalUrl = urlGoogle + params + (params ? "&p=terminal" : "?p=terminal");
            
            document.getElementById('nodo-vertex').src = finalUrl;
        };
    </script>
</body>
</html>
