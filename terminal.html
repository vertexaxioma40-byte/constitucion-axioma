<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Vertex Axioma | Terminal Blindada</title>
    <style>
        body { background: #050a15; color: #4da6ff; font-family: 'Courier New', monospace; display: flex; justify-content: center; padding-top: 30px; }
        .terminal { background: #0a1122; border: 2px solid #ff4d4d; width: 480px; padding: 30px; border-radius: 12px; box-shadow: 0 0 30px rgba(255, 77, 77, 0.3); }
        input { width: 92%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #4da6ff; color: #0f0; border-radius: 4px; }
        .input-error { border-color: #ff4d4d ! competitiveness; }
        button { background: #002060; color: #fff; border: 1px solid #4da6ff; padding: 18px; width: 100%; cursor: pointer; font-weight: bold; font-size: 1.1rem; border-radius: 4px; transition: 0.3s; }
        button:hover { background: #4da6ff; color: #000; }
        button:disabled { background: #333; border-color: #555; cursor: not-allowed; }
        #log { font-size: 11px; text-align: left; height: 180px; overflow-y: auto; background: #000; padding: 12px; margin-top: 20px; border: 1px solid #1a2a44; color: #4da6ff; }
    </style>
</head>
<body>
    <div class="terminal">
        <h2 style="text-align:center; color: #ff4d4d; margin-bottom: 5px;">VERTEX AXIOMA®</h2>
        <p style="text-align:center; font-size: 0.7rem; color: #888; margin-bottom: 25px;">SISTEMA DE ACCESO RESTRINGIDO</p>
        
        <label style="font-size: 0.7rem;">ID DE ACCESO AUTORIZADO</label>
        <input type="password" id="idAcceso" placeholder="Ingrese ID de Cliente">
        
        <label style="font-size: 0.7rem;">EMAIL DE SELLO</label>
        <input type="email" id="email" placeholder="email@cliente.com">
        
        <input type="hidden" id="operador" value="OPERADOR VERTEX">
        
        <button id="btnEjecutar" onclick="iniciarProtocolo()">AUTORIZAR Y EJECUTAR</button>
        
        <div id="log">> STANDBY - ESPERANDO CREDENCIALES...</div>
    </div>

    <script>
        // --- CONFIGURACIÓN DE SEGURIDAD ---
        const ID_VALIDO = "VERTEX-2026"; // <--- CAMBIA TU CLAVE AQUÍ
        let ejecutando = false;

        async function iniciarProtocolo() {
            if (ejecutando) return;
            
            const idIngresado = document.getElementById('idAcceso').value;
            const mail = document.getElementById('email').value;
            const log = document.getElementById('log');
            const btn = document.getElementById('btnEjecutar');

            // VALIDACIÓN DE SEGURIDAD LOCAL
            if (idIngresado !== ID_VALIDO) {
                log.innerHTML = "<span style='color:red;'>[ERROR] ID DE ACCESO NO AUTORIZADO. ACCESO DENEGADO.</span>";
                return;
            }

            if (!mail) { 
                alert("Email Requerido para el Sello de Inmutabilidad"); 
                return; 
            }

            ejecutando = true;
            btn.disabled = true;
            btn.innerText = "ACCESO CONCEDIDO...";
            log.innerHTML = "> Credenciales Validadas...<br>> Iniciando Protocolo Axioma...<br>";

            const nodos = ["BALANZA", "CAMION", "DRON", "RIEGO", "HUMEDAD", "OPTICO", "SENTINEL", "AGROMONITORING", "WEATHER"];
            
            for(let n of nodos) {
                log.innerHTML += `> Nodo ${n}: <span style="color:#0f0">PETRIFICADO</span><br>`;
                log.scrollTop = log.scrollHeight;
                await new Promise(r => setTimeout(r, 400));
            }

            // URL DE TU SCRIPT (Asegurate de que sea la última)
            const url = "https://script.google.com/macros/s/AKfycbzG_s9OTcb_N4q5u0KwhzFedcyXpOK_J2ziBA2ef_KJAxRJYAYHxXIJCWU9OJeDgt--/exec";
            
            try {
                await fetch(`${url}?nombre=AUTHORIZED_NODE&mailEmpresa=${encodeURIComponent(mail)}`, {
                    method: 'GET',
                    mode: 'no-cors',
                    cache: 'no-cache'
                });
                log.innerHTML += "<br><span style='color:#0f0; font-weight:bold;'>[EXITO] BARRIDO FINALIZADO Y SELLADO EN BLOCKCHAIN.</span>";
            } catch (e) {
                log.innerHTML += "<br><span style='color:red;'>[ERROR] FALLO DE COMUNICACIÓN CON EL NODO CENTRAL.</span>";
            } finally {
                btn.innerText = "PROTOCOLO CERRADO";
            }
        }
    </script>
</body>
</html>
