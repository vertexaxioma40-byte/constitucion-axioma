<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma | Terminal de Carga</title>
    <style>
        html, body { 
            background-color: #050a15 !important; 
            color: #ffffff !important; 
            margin: 0; padding: 0; 
            font-family: 'Courier New', Courier, monospace;
        }
        body { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .container { 
            background: #0a1122; 
            padding: 30px; 
            border: 2px solid #002060; 
            border-radius: 8px; 
            box-shadow: 0 0 20px rgba(0, 32, 96, 0.8); 
            width: 100%; max-width: 450px; text-align: center;
        }
        h1 { font-size: 1.4rem; color: #ffffff !important; margin: 0; }
        .nodo-sub { color: #4da6ff !important; font-size: 0.8rem; display: block; margin: 10px 0; }
        .divider { height: 1px; background: #002060; margin: 15px 0; }
        form { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
        label { font-size: 0.7rem; color: #4da6ff; text-align: left; text-transform: uppercase; }
        input { 
            background: #000 !important; border: 1px solid #4da6ff !important; 
            color: #ffffff !important; padding: 12px; 
            font-family: 'Courier New', monospace;
        }
        button { 
            background: #002060; color: #ffffff; border: 1px solid #4da6ff; 
            padding: 15px; cursor: pointer; font-weight: bold;
            text-transform: uppercase; margin-top: 10px;
        }
        button:hover { background: #003399; }
        .status-msg { font-size: 0.8rem; margin-top: 15px; color: #4da6ff; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>TERMINAL DE CARGA 4.0</h1>
    <span class="nodo-sub">Contrato de Adhesión & Metadatos</span>
    <div class="divider"></div>
    <p style="font-size: 0.8rem;">Firme su compromiso y registre los metadatos para petrificar su Sello de Inmutabilidad.</p>
    
    <form id="terminal-form">
        <input type="hidden" name="tipo_documento" value="CONTRATO">

        <label>Identificación del Responsable</label>
        <input type="text" name="nombre" id="term_nombre" placeholder="NOMBRE COMPLETO" required>
        <input type="email" name="email" id="term_email" placeholder="EMAIL INSTITUCIONAL" required>
        
        <div class="divider"></div>
        <label>Metadatos del Activo (Prueba Técnica)</label>
        <input type="text" name="pureza" placeholder="PUREZA (Ej: 99.5%)" required>
        <input type="text" name="peso" placeholder="PESO / HUMEDAD (Ej: 4500 kg)" required>
        <input type="text" name="coords" id="coords-input" placeholder="GPS (Lat, Long)" required>
        
        <button type="submit" id="submit-btn">ACEPTAR TÉRMINOS Y PETRIFICAR</button>
        <div id="status" class="status-msg">PROCESANDO PROTOCOLO AXIOMA®...</div>
    </form>
</div>

<script>
    const URL_API_CERTIFICACION = "https://script.google.com/macros/s/AKfycby2-GFVDJSI14EKRtO1lygO5h5SSaesIk_xbbzjnL0PkjQwovkUxcT23xraR5Mv_cxVAg/exec";
    
    const form = document.getElementById('terminal-form');
    const btn = document.getElementById('submit-btn');
    const status = document.getElementById('status');

    // FUNCIÓN DE AUTO-COMPLETADO AL CARGAR
    window.onload = () => {
        // GPS automático
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                document.getElementById('coords-input').value = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
            });
        }

        // Recuperar memoria Axioma
        const nombreGuardado = localStorage.getItem('vertex_nombre');
        const emailGuardado = localStorage.getItem('vertex_email');

        if (nombreGuardado) document.getElementById('term_nombre').value = nombreGuardado;
        if (emailGuardado) document.getElementById('term_email').value = emailGuardado;
    };

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.style.display = "none";
        status.style.display = "block";

        const formData = new FormData(form);
        
        fetch(URL_API_CERTIFICACION, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: new URLSearchParams(formData)
        })
        .then(() => { 
            status.innerText = "¡CONTRATO Y SELLO EMITIDOS!";
            alert("🛡️ Protocolo Vertex Axioma® Finalizado.");
            setTimeout(() => { window.location.href = 'index.html'; }, 3000);
        })
        .catch(err => { 
            console.error(err);
            alert("Error en la sincronización."); 
            btn.style.display = "block";
            status.style.display = "none";
        });
    });
</script>

</body>
</html>
