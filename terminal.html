<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vertex Axioma | Terminal de Carga</title>
    <style>
        html, body { background-color: #050a15 !important; color: #ffffff !important; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .box { background: #0a1122; padding: 30px; border: 2px solid #002060; border-radius: 10px; width: 100%; max-width: 450px; box-shadow: 0 0 20px rgba(0, 32, 96, 0.8); }
        h3 { text-align: center; letter-spacing: 2px; color: #ffffff; text-transform: uppercase; margin-bottom: 20px; }
        form { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.7rem; color: #4da6ff; margin-top: 10px; font-weight: bold; text-transform: uppercase; }
        input { background: #000 !important; border: 1px solid #4da6ff !important; color: #ffffff !important; padding: 12px; font-size: 0.9rem; width: 100%; box-sizing: border-box; }
        input:read-only { border-color: #002060 !important; color: #4da6ff; }
        hr { border: 0; border-top: 1px solid #002060; margin: 15px 0; }
        button { background: #002060; color: #ffffff; border: 1px solid #4da6ff; padding: 18px; cursor: pointer; font-weight: bold; text-transform: uppercase; margin-top: 20px; }
        button:hover { background: #003399; box-shadow: 0 0 10px #4da6ff; }
    </style>
</head>
<body>
    <div class="box">
        <h3>TERMINAL VERTEX</h3>
        <form id="v-form">
            <label>Responsable</label>
            <input type="text" name="nombre" id="n" placeholder="Nombre no detectado" required>
            <input type="email" name="email" id="e" placeholder="Email no detectado" required>
            
            <hr>
            
            <label>Metadatos del Activo</label>
            <input type="text" name="titular" placeholder="Titular (Ej: Vadell)" required>
            <input type="text" name="activo" placeholder="Activo (Ej: Litio / Soja)" required>
            <input type="text" name="pureza" placeholder="Pureza" required>
            <input type="text" name="peso" placeholder="Peso" required>
            
            <label>Ubicación Satelital (GPS)</label>
            <input type="text" name="coords" id="c" value="Obteniendo señal..." readonly>
            
            <button type="submit" id="b">AUTORIZAR Y PETRIFICAR</button>
        </form>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbyYpqgLUSyhk0LKZEOmDVN5m_OFdCuD9SQDGhXno78fe1KuxhgjNMgCDhJ_7iHam29y/exec"; 

        window.onload = () => {
            // 1. CARGA DE DATOS DESDE LOCALSTORAGE (MEMORIA)
            // Asegúrate de que en indice.html se guarden con estos mismos nombres
            const nombreGuardado = localStorage.getItem('vertex_nombre');
            const emailGuardado = localStorage.getItem('vertex_email');

            if (nombreGuardado) document.getElementById('n').value = nombreGuardado;
            if (emailGuardado) document.getElementById('e').value = emailGuardado;

            // 2. ACTIVACIÓN DE GPS FORENSE
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    p => {
                        document.getElementById('c').value = p.coords.latitude.toFixed(5) + ", " + p.coords.longitude.toFixed(5);
                    },
                    err => {
                        document.getElementById('c').value = "GPS: Acceso Denegado";
                        console.error("Error GPS:", err);
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                document.getElementById('c').value = "GPS: No soportado";
            }
        };

        document.getElementById('v-form').onsubmit = (e) => {
            e.preventDefault();
            const btn = document.getElementById('b');
            btn.innerText = "BLOQUEANDO CADENA...";
            btn.disabled = true;

            const params = new URLSearchParams(new FormData(e.target)).toString();
            
            fetch(API + "?" + params, { mode: 'no-cors' })
            .then(() => {
                alert("🛡️ Sello de Inmutabilidad Transfronteriza Emitido.");
                window.location.href = 'index.html';
            })
            .catch(err => {
                alert("Error de comunicación con el Nodo.");
                btn.innerText = "REINTENTAR";
                btn.disabled = false;
            });
        };
    </script>
</body>
</html>
