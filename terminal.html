<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma - API de Integridad</title>
    <style>
        :root {
            --azul-axioma: #002060;
            --dorado-forense: #C5A059;
            --blanco-puro: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--blanco-puro);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border-top: 8px solid var(--azul-axioma);
        }
        img.logo {
            max-width: 200px;
            margin-bottom: 20px;
        }
        h2 { color: var(--azul-axioma); font-size: 1.5rem; margin-bottom: 5px; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 25px; }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            text-align: center;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--dorado-forense);
            outline: none;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            font-size: 1rem;
        }
        .btn-carga {
            background-color: var(--azul-axioma);
            color: white;
        }
        .btn-consulta {
            background-color: var(--dorado-forense);
            color: var(--azul-axioma);
        }
        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.7rem;
            color: #999;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://raw.githubusercontent.com/TU_USUARIO/TU_REPO/main/Logo.jpg" alt="Vertex Axioma" class="logo">
    
    <h2>Centro de Mando</h2>
    <p>Protocolo de Integridad Forense 4.9</p>

    <input type="text" id="tokenInput" placeholder="Ingrese su Token Vertex">

    <div class="btn-group">
        <button class="btn-carga" onclick="ejecutar('carga')">INICIAR BARRIDO DE NODOS</button>
        <button class="btn-consulta" onclick="ejecutar('consulta')">CONSULTAR ACTIVOS</button>
    </div>

    <div class="footer">
        CONSTITUCIÓN AXIOMA® | PROTECCIÓN FORENSE
    </div>
</div>

<script>
    function ejecutar(accion) {
        const token = document.getElementById('tokenInput').value;
        const scriptURL = "https://script.google.com/macros/s/AKfycbyTRvBmBKnfle2PJkfiIS8IfQnVby4A58EMtvn7ekvoO83zXoF1xu1taxRgOJiGBEnf/exec";

        if (!token) {
            alert("Por favor, ingrese un token válido.");
            return;
        }

        // Construimos la URL con la acción específica
        const finalURL = `${scriptURL}?token=${token}&accion=${accion}`;
        
        // Redirigimos o procesamos según la necesidad
        window.location.href = finalURL;
    }
</script>

</body>
</html>
