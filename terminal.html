<script>
    const URL_API_CERTIFICACION = "https://script.google.com/macros/s/AKfycby2-GFVDJSI14EKRtO1lygO5h5SSaesIk_xbbzjnL0PkjQwovkUxcT23xraR5Mv_cxVAg/exec";
    
    const form = document.getElementById('terminal-form');
    const btn = document.getElementById('submit-btn');
    const status = document.getElementById('status');

    // PROTOCOLO DE RECUPERACIÓN DE DATOS (AUTO-COMPLETADO)
    window.onload = () => {
        // 1. Intentar obtener GPS automáticamente
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                const coordsInput = document.getElementById('coords-input');
                if(coordsInput) coordsInput.value = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
            });
        }

        // 2. Recuperar Identidad desde la Memoria Axioma (LocalStorage)
        const nombreGuardado = localStorage.getItem('vertex_nombre');
        const emailGuardado = localStorage.getItem('vertex_email');

        if (nombreGuardado) form.querySelector('input[name="nombre"]').value = nombreGuardado;
        if (emailGuardado) form.querySelector('input[name="email"]').value = emailGuardado;
    };

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        btn.disabled = true;
        btn.style.display = "none";
        status.style.display = "block";

        const formData = new FormData(form);
        
        fetch(URL_API_CERTIFICACION, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: new URLSearchParams(formData)
        })
        .then(() => { 
            status.innerText = "¡CONTRATO Y SELLO EMITIDOS!";
            alert("🛡️ Protocolo Vertex Axioma® Finalizado.\n\nEl Contrato de Adhesión y su Sello de Inmutabilidad han sido petrificados y enviados a su casilla de correo.");
            
            // Opcional: Limpiar memoria después de finalizar el proceso
            // localStorage.clear(); 
            
            setTimeout(() => { window.location.href = 'index.html'; }, 3000);
        })
        .catch(err => { 
            console.error(err);
            alert("Error en la sincronización del Nodo."); 
            btn.disabled = false; 
            btn.style.display = "block";
            status.style.display = "none";
        });
    });
</script>
