<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <title>Vertex Axioma - Terminal Forense</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0e1a2b; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #16263e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 420px; border: 1px solid #2a4165; }
        h2 { text-align: center; color: #4fc3f7; margin-bottom: 20px; letter-spacing: 2px; text-transform: uppercase; border-bottom: 2px solid #4fc3f7; padding-bottom: 10px; font-size: 1.2em; }
        .input-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 0.85em; color: #90caf9; font-weight: bold; }
        input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #2a4165; background: #0e1a2b; color: #fff; box-sizing: border-box; font-size: 0.9em; }
        .row { display: flex; gap: 10px; }
        .row .input-group { flex: 1; }
        button { width: 100%; padding: 14px; background: #0288d1; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1em; transition: 0.3s; margin-top: 15px; border: 1px solid #4fc3f7; }
        button:hover { background: #03a9f4; box-shadow: 0 0 15px rgba(3,169,244,0.5); }
        button:disabled { background: #455a64; border-color: #546e7a; cursor: not-allowed; }
        #status { margin-top: 15px; text-align: center; font-size: 0.85em; padding: 10px; border-radius: 5px; display: none; }
        .success { background: rgba(76, 175, 80, 0.2); color: #81c784; border: 1px solid #4caf50; }
        .error { background: rgba(244, 67, 54, 0.2); color: #e57373; border: 1px solid #f44336; }
        .footer { text-align: center; font-size: 0.7em; margin-top: 20px; color: #546e7a; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Vertex Axioma</h2>
        
        <div class="input-group">
            <label>NOMBRE (Operador/Técnico)</label>
            <input type="text" id="nombre" placeholder="Nombre del técnico">
        </div>

        <div class="input-group">
            <label>EMAIL TÉCNICO (Para comprobante)</label>
            <input type="email" id="email" placeholder="tu-email@tecnico.com">
        </div>

        <div class="input-group">
            <label>ACTIVO (Sello solicitado para)</label>
            <input type="text" id="activo" placeholder="Ej: Litio Vantac">
        </div>

        <div class="row">
            <div class="input-group">
                <label>PUREZA (%)</label>
                <input type="text" id="pureza" placeholder="98%">
            </div>
            <div class="input-group">
                <label>PESO (Kg/Tn)</label>
                <input type="text" id="peso" placeholder="500tn">
            </div>
        </div>

        <div class="input-group">
            <label>COORDENADAS GPS</label>
            <input type="text" id="coords" placeholder="-23.385, -66.745">
        </div>
        
        <button id="btnPetrificar" onclick="enviarDatos()">PETRIFICAR REGISTRO 4.0</button>
        
        <div id="status"></div>
        
        <div class="footer">
            <b>Sello de Inmutabilidad Transfronteriza</b><br>
            Vertex Axioma - Protocolo AXIOMA®
        </div>
    </div>

    <script>
        // Capturamos el mail de la empresa del índice
        let mailEmpresaOriginal = "";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // Prioridad Índice sobre Memoria
            const n = urlParams.get('nombre') || localStorage.getItem('v_nombre');
            const e = urlParams.get('email') || localStorage.getItem('v_email');
            mailEmpresaOriginal = urlParams.get('mailEmpresa') || e; // Guardamos el mail de la empresa

            if(n) document.getElementById('nombre').value = n;
            if(e) document.getElementById('email').value = e;
            if(urlParams.get('activo')) document.getElementById('activo').value = urlParams.get('activo');
            if(urlParams.get('pureza')) document.getElementById('pureza').value = urlParams.get('pureza');
            if(urlParams.get('peso')) document.getElementById('peso').value = urlParams.get('peso');
            if(urlParams.get('coords')) document.getElementById('coords').value = urlParams.get('coords');
        };

        function enviarDatos() {
            const btn = document.getElementById('btnPetrificar');
            const status = document.getElementById('status');
            
            // USAR TU URL DE GOOGLE SCRIPT v6.1
            const urlBase = "https://script.google.com/macros/s/AKfycbzV8yTwLaVF7EsCwTm9I8v8jJEdPX2UJPX-fc2g04ZDc8JJwNuPOxnbPwRJ_WZqaxoJ/exec"; 
            
            const fields = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                mailEmpresa: mailEmpresaOriginal, // Enviamos el mail de Vantac por atrás
                activo: document.getElementById('activo').value,
                pureza: document.getElementById('pureza').value,
                peso: document.getElementById('peso').value,
                coords: document.getElementById('coords').value
            };

            if(!fields.nombre || !fields.email || !fields.coords) {
                mostrarStatus("⚠️ Error: Campos críticos vacíos.", "error");
                return;
            }

            // Guardar para el próximo logueo
            localStorage.setItem('v_nombre', fields.nombre);
            localStorage.setItem('v_email', fields.email);

            // Acción del botón
            btn.disabled = true;
            btn.innerText = "PETRIFICANDO...";
            status.style.display = "none";

            const params = new URLSearchParams(fields).toString();
            
            console.log("Enviando a:", urlBase + "?" + params); // Para ver en consola si falla

            fetch(`${urlBase}?${params}`, { mode: 'no-cors' }) // 'no-cors' ayuda a evitar bloqueos de navegador
                .then(() => {
                    mostrarStatus("✅ ¡Impacto en MONITOR Exitoso! Verificá tu correo.", "success");
                    btn.disabled = false;
                    btn.innerText = "PETRIFICAR REGISTRO 4.0";
                })
                .catch(err => {
                    mostrarStatus("❌ Error de red. Revisá la consola.", "error");
                    btn.disabled = false;
                    btn.innerText = "REINTENTAR";
                    console.error(err);
                });
        }

        function mostrarStatus(msg, tipo) {
            const status = document.getElementById('status');
            status.innerText = msg;
            status.className = tipo;
            status.style.display = "block";
        }
    </script>
</body>
</html>
