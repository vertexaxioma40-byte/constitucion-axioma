<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <title>Vertex Axioma - Terminal de Registro Forense</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0e1a2b; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #16263e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 400px; border: 1px solid #2a4165; }
        h2 { text-align: center; color: #4fc3f7; margin-bottom: 25px; letter-spacing: 2px; text-transform: uppercase; border-bottom: 2px solid #4fc3f7; padding-bottom: 10px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #90caf9; }
        input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #2a4165; background: #0e1a2b; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0288d1; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1.1em; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #03a9f4; box-shadow: 0 0 15px rgba(3,169,244,0.5); }
        #status { margin-top: 20px; text-align: center; font-size: 0.85em; padding: 10px; border-radius: 5px; display: none; }
        .success { background: rgba(76, 175, 80, 0.2); color: #81c784; border: 1px solid #4caf50; }
        .error { background: rgba(244, 67, 54, 0.2); color: #e57373; border: 1px solid #f44336; }
        .logo { text-align: center; font-size: 0.7em; margin-top: 15px; color: #546e7a; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Vertex Axioma</h2>
        <div class="input-group">
            <label>Nombre del Operador / Activo</label>
            <input type="text" id="nombre" placeholder="Ej: Salar Olaroz Test">
        </div>
        <div class="input-group">
            <label>Email para Reporte AXIOMA®</label>
            <input type="email" id="email" placeholder="ejemplo@correo.com">
        </div>
        <div class="input-group">
            <label>Coordenadas GPS (Lat, Lon)</label>
            <input type="text" id="coords" placeholder="-23.385, -66.745">
        </div>
        <div class="input-group">
            <label>Activo / Mineral</label>
            <input type="text" id="activo" placeholder="Ej: Litio / Cobre">
        </div>
        
        <button onclick="enviarDatos()">PETRIFICAR REGISTRO</button>
        
        <div id="status"></div>
        
        <div class="logo">
            Sello de Inmutabilidad Transfronteriza<br>
            Protocolo de Integridad Forense v4.6
        </div>
    </div>

    <script>
        function enviarDatos() {
            const btn = document.querySelector('button');
            const status = document.getElementById('status');
            const urlBase = "https://script.google.com/macros/s/AKfycbwIs3RjPktzqPX7I45hM_iIcuuPCGOQsStZ7gQowWM0l6sS-wVziMw-LleP7DD-PYoE/exec"; // <--- PEGA TU URL DE GOOGLE SCRIPT AQUÍ
            
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const coords = document.getElementById('coords').value;
            const activo = document.getElementById('activo').value;

            if(!nombre || !email || !coords) {
                mostrarStatus("Faltan datos críticos para el Protocolo.", "error");
                return;
            }

            btn.disabled = true;
            btn.innerText = "PROCESANDO SATÉLITE...";
            status.style.display = "none";

            const urlFinal = `${urlBase}?nombre=${encodeURIComponent(nombre)}&email=${encodeURIComponent(email)}&coords=${encodeURIComponent(coords)}&activo=${encodeURIComponent(activo)}`;

            fetch(urlFinal)
                .then(response => response.text())
                .then(data => {
                    mostrarStatus("¡Registro Petrificado con Éxito! Revisá tu mail.", "success");
                    btn.disabled = false;
                    btn.innerText = "PETRIFICAR REGISTRO";
                })
                .catch(error => {
                    mostrarStatus("Error de Conexión con el Nodo Vertex.", "error");
                    btn.disabled = false;
                    btn.innerText = "REINTENTAR PETRIFICACIÓN";
                });
        }

        function mostrarStatus(msg, tipo) {
            const status = document.getElementById('status');
            status.innerText = msg;
            status.className = tipo;
            status.style.display = "block";
        }
    </script>
</body>
</html>
