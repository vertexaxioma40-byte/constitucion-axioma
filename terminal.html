<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma | Terminal de Operaciones</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%;
            overflow: hidden; 
            background-color: #050a15; 
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>
    <iframe id="nodo-vertex" src=""></iframe>

    <script>
        // Este script detecta los datos de la URL y los pasa al "motor" de Google
        window.onload = function() {
            const urlGoogle = "TU_URL_DE_GOOGLE_EXEC"; // <--- PEGA TU LINK ACÁ
            const params = window.location.search;
            
            // Si venimos del Indice, le pegamos los parámetros a la URL de Google
            const finalUrl = urlGoogle + params + (params ? "&p=terminal" : "?p=terminal");
            
            document.getElementById('nodo-vertex').src = finalUrl;
        };
    </script>
</body>
</html>
