<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #050a15; color: #4da6ff; font-family: 'Courier New', monospace; display: flex; justify-content: center; padding-top: 30px; }
        .terminal { background: #0a1122; border: 2px solid #4da6ff; width: 480px; padding: 30px; border-radius: 12px; box-shadow: 0 0 30px rgba(77, 166, 255, 0.4); }
        input { width: 92%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #4da6ff; color: #0f0; border-radius: 4px; }
        button { background: #002060; color: #fff; border: 1px solid #4da6ff; padding: 18px; width: 100%; cursor: pointer; font-weight: bold; font-size: 1.1rem; border-radius: 4px; }
        button:disabled { background: #333; border-color: #555; cursor: not-allowed; }
        #log { font-size: 11px; text-align: left; height: 200px; overflow-y: auto; background: #000; padding: 12px; margin-top: 20px; border: 1px solid #1a2a44; color: #4da6ff; }
    </style>
</head>
<body>
    <div class="terminal">
        <h2 style="text-align:center; margin-bottom: 5px;">VERTEX AXIOMA V.10</h2>
        <p style="text-align:center; font-size: 0.7rem; color: #888; margin-bottom: 25px;">Sello de Conformidad Fiscal 4.0</p>
        
        <input type="text" id="operador" value="OPERADOR VERTEX">
        <input type="email" id="email" placeholder="Email para Sello de Inmutabilidad">
        
        <button id="btnEjecutar" onclick="iniciarProtocolo()">EJECUTAR PROTOCOLO INTEGRAL</button>
        
        <div id="log">> SISTEMA EN ESPERA...</div>
    </div>

    <script>
        let ejecutando = false;

        async function iniciarProtocolo() {
            if (ejecutando) return; // Blindaje contra doble clic
            
            const btn = document.getElementById('btnEjecutar');
            const log = document.getElementById('log');
            const mail = document.getElementById('email').value;
            const op = document.getElementById('operador').value;

            if(!mail) { alert("Email Requerido"); return; }

            ejecutando = true;
            btn.disabled = true;
            btn.innerText = "PROCESANDO PROTOCOLO...";
            log.innerHTML = "> Iniciando Barrido de Nodos...<br>";

            const nodos = ["BALANZA", "CAMION", "DRON", "RIEGO", "HUMEDAD", "OPTICO", "SENTINEL", "AGROMONITORING", "WEATHER"];
            
            for(let n of nodos) {
                log.innerHTML += `> Nodo ${n}: <span style="color:#0f0">PETRIFICADO</span><br>`;
                log.scrollTop = log.scrollHeight;
                await new Promise(r => setTimeout(r, 400));
            }

            log.innerHTML += "> Generando Sello Transfronterizo...<br>";

            // REEMPLAZA CON TU URL DE DEPLOY
            const url = "https://script.google.com/macros/s/AKfycbxWxZEldqaHImCwxlMb6zKLr6anz-HX0h8_5q2nevY7okbPziCs7hDZp1ouU2Oy2po/exec";
            
            try {
                // Usamos una técnica de fetch más limpia para evitar re-intentos
                await fetch(`${url}?nombre=${encodeURIComponent(op)}&mailEmpresa=${encodeURIComponent(mail)}`, {
                    method: 'GET',
                    mode: 'no-cors',
                    cache: 'no-cache'
                });
                
                log.innerHTML += "<br><span style='color:#0f0; font-weight:bold;'>[EXITO] IMPACTO EN EXCEL Y ENVÍO DE PDF COMPLETADO.</span>";
            } catch (e) {
                log.innerHTML += "<br><span style='color:red;'>[ERROR] FALLO EN LA CONEXIÓN CON EL NODO CENTRAL.</span>";
            } finally {
                btn.innerText = "PROTOCOLO FINALIZADO";
                // No habilitamos el botón de nuevo para evitar que se cree otra prueba accidental
            }
        }
    </script>
</body>
</html>
