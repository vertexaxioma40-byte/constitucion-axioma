<div class="terminal-box">
    <h2>TERMINAL V.8.5 - FULL AUTOMATION</h2>
    <div class="data-stream">PROTOCOLO DE INTEGRIDAD TRANSFRONTERIZA</div>

    <label>Oficial de Integridad</label>
    <input type="text" id="nombre" value="OPERADOR VERTEX">

    <label>Email Titular (Para Sello)</label>
    <input type="email" id="mailEmpresa" placeholder="empresa@dominio.com">

    <button onclick="ejecutarBarridoCompleto()">INICIAR PROTOCOLO AXIOMA®</button>
    
    <div id="log-proceso">SISTEMA EN ESPERA...</div>
    <div id="status">ESTADO: LISTO PARA PETRIFICACIÓN</div>
</div>

<script>
    async function ejecutarBarridoCompleto() {
        const btn = document.querySelector('button');
        const log = document.getElementById('log-proceso');
        const status = document.getElementById('status');
        const nombre = document.getElementById('nombre').value;
        const mail = document.getElementById('mailEmpresa').value;

        if (!mail) { alert("Email requerido para el Sello"); return; }

        btn.disabled = true;
        log.innerHTML = "";
        status.innerText = "INICIANDO BARRIDO DE EVIDENCIA...";

        // Fuentes a procesar automáticamente
        const fuentes = ["BALANZA", "DRON", "RIEGO", "HUMEDAD", "OPTICO", "SENTINEL", "AGROMONITORING", "GOOGLEMAPS", "OPENWEATHER"];

        for (let f of fuentes) {
            const linea = document.createElement("div");
            linea.innerText = `> Accediendo a Nodo ${f}...`;
            log.appendChild(linea);
            await new Promise(r => setTimeout(r, 600)); // Simulación de latencia de red
            linea.innerHTML += " <span style='color:#00ff00'>[CAPTURADO]</span>";
            log.scrollTop = log.scrollHeight;
        }

        status.innerText = "SELLANDO EN CADENA DE CUSTODIA...";
        
        // URL de tu Script de Google (Asegúrate de actualizarla tras el nuevo Deploy)
        const scriptURL = "https://script.google.com/macros/s/AKfycbwjRAqfhrl_UXLeBRK-QVE6WayC6ZJs3OZnL1CZQhjXCccUe_d3a_QF_xhELz3rWgp0/exec"; 
        const finalUrl = `${scriptURL}?nombre=${encodeURIComponent(nombre)}&mailEmpresa=${encodeURIComponent(mail)}`;

        fetch(finalUrl, { mode: 'no-cors' })
        .then(() => {
            status.innerText = "SELLO DE INMUTABILIDAD TRANSFRONTERIZA EMITIDO";
            log.innerHTML += "<div style='color:#00ff00; margin-top:10px;'>>>> HASH INTEGRADOR PETRIFICADO CON ÉXITO</div>";
            btn.innerText = "PROCESO FINALIZADO ✅";
        });
    }
</script>
