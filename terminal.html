<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma | Terminal de Operaciones</title>
    <style>
        html, body { background-color: #050a15; color: #ffffff; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
        .container { background: #0a1122; padding: 30px; border: 2px solid #002060; border-radius: 10px; box-shadow: 0 0 30px rgba(0, 32, 96, 0.6); width: 100%; max-width: 600px; }
        h2 { font-size: 1.4rem; letter-spacing: 2px; color: #4da6ff; text-align: center; border-bottom: 1px solid #002060; padding-bottom: 10px; }
        .info-panel { background: #000; padding: 15px; border-left: 4px solid #4da6ff; margin-bottom: 20px; font-size: 0.85rem; }
        .control-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        label { font-size: 0.75rem; color: #4da6ff; text-transform: uppercase; font-weight: bold; }
        input, select { background: #050a15; border: 1px solid #002060; color: #fff; padding: 12px; font-family: 'Courier New', monospace; font-size: 1rem; }
        input:focus, select:focus { border-color: #4da6ff; outline: none; }
        .btn-petrificar { background: #002060; color: #fff; border: 1px solid #4da6ff; padding: 20px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; width: 100%; font-size: 1.1rem; }
        .btn-petrificar:hover { background: #003399; box-shadow: 0 0 20px #4da6ff; }
        .btn-petrificar:disabled { opacity: 0.5; cursor: not-allowed; }
        hr { border: 0; border-top: 1px dashed #002060; margin: 20px 0; }
        .status-tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 0.7rem; background: #002060; color: #4da6ff; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>NODO DE OPERACIONES VERTEX</h2>
    
    <div class="info-panel" id="user-info">
        <div>OPERADOR: <span id="display-nombre">Cargando...</span></div>
        <div>TITULAR: <span id="display-titular">Cargando...</span></div>
        <div class="status-tag">ESTADO: CONECTADO AL NODO</div>
    </div>

    <div class="control-group">
        <label for="idOperacion">🆔 ID DE OPERACIÓN (SESIÓN DE AUDITORÍA):</label>
        <input type="text" id="idOperacion" placeholder="Ej: OP-XXC-001" value="OP-MAR17-001">
        
        <label for="idActivo">🚛 ACTIVO / UNIDAD IDENTIFICADA:</label>
        <select id="idActivo">
            <option value="CAMION_SCANIA_01">Camión Scania - Interno 01</option>
            <option value="CAMION_SCANIA_02">Camión Scania - Interno 02</option>
            <option value="SILO_ACOPIO_A">Silo de Acopio A (Planta)</option>
            <option value="VAGON_BELGRANO_C">Vagón Ferroviario - Unidad C</option>
            <option value="DRON_SURVEY_01">Misión de Vuelo - DJI P1</option>
        </select>
    </div>

    <hr>

    <div class="control-group">
        <label for="fuente">📡 FUENTE DE EVIDENCIA ACTUAL:</label>
        <select id="fuente">
            <option value="BALANZA">⚖️ Balanza de Precisión (Peso Neto)</option>
            <option value="DRON">🛰️ Reporte Aterrizaje Dron (Volumetría)</option>
            <option value="HUMEDAD">💧 Sensor Humedad Suelo (IoT)</option>
            <option value="OPTICO">🔬 Firma Espectral (Calidad Óptica)</option>
            <option value="RIEGO">🚿 Telemetría de Riego</option>
        </select>
    </div>

    <button onclick="ejecutarPetrificacion()" class="btn-petrificar" id="btn-main">
        🛡️ PETRIFICAR EVIDENCIA
    </button>

    <div style="text-align: center; margin-top: 15px;">
        <p style="font-size: 0.7rem; color: #4da6ff; opacity: 0.6;">
            Sincronización Forense con Vertex Axioma® v4.0
        </p>
    </div>
</div>

<script>
    // 1. Al cargar la página, recuperamos los datos de la "mochila"
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        
        // Priorizamos URL, si no, buscamos en LocalStorage
        const nombre = params.get('nombre') || localStorage.getItem('v_nombre') || "Sin Identificar";
        const titular = params.get('titular') || localStorage.getItem('v_titular') || "Sin Identificar";
        
        document.getElementById('display-nombre').innerText = nombre;
        document.getElementById('display-titular').innerText = titular;
    };

    // 2. Función principal de envío al Tribunal (Código.gs)
    function ejecutarPetrificacion() {
        const btn = document.getElementById('btn-main');
        const params = new URLSearchParams(window.location.search);
        
        btn.innerText = "⚡ PROCESANDO HASH MAESTRO...";
        btn.disabled = true;

        const datos = {
            nombre: params.get('nombre') || localStorage.getItem('v_nombre'),
            email: params.get('email') || localStorage.getItem('v_email'),
            titular: params.get('titular') || localStorage.getItem('v_titular'),
            mailEmpresa: params.get('mailEmpresa') || localStorage.getItem('v_mailEmpresa'),
            idOperacion: document.getElementById('idOperacion').value,
            idActivo: document.getElementById('idActivo').value,
            fuente: document.getElementById('fuente').value
        };

        // Enviamos al cerebro en Código.gs
        google.script.run
            .withSuccessHandler(function(res) {
                alert("✅ ÉXITO: Evidencia del activo " + datos.idActivo + " ha sido petrificada bajo la Operación " + datos.idOperacion);
                btn.innerText = "🛡️ PETRIFICAR EVIDENCIA";
                btn.disabled = false;
            })
            .withFailureHandler(function(err) {
                alert("❌ ERROR CRÍTICO DE CONEXIÓN");
                btn.innerText = "🛡️ REINTENTAR";
                btn.disabled = false;
            })
            .procesarEntradaVertex(datos);
    }
</script>

</body>
</html>
