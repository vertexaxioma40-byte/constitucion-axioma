<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Vertex Axioma | Terminal Forense</title>
    <style>
        body { background: #050a15; color: #4da6ff; font-family: 'Courier New', monospace; text-align: center; }
        .terminal { background: #0a1122; border: 2px solid #4da6ff; width: 450px; margin: 50px auto; padding: 25px; border-radius: 10px; box-shadow: 0 0 20px rgba(77, 166, 255, 0.4); }
        h2 { font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 20px; }
        label { display: block; font-size: 0.7rem; color: #888; text-align: left; margin-left: 5%; }
        input { width: 90%; padding: 12px; margin: 8px 0 15px 0; background: #000; border: 1px solid #4da6ff; color: #0f0; border-radius: 3px; }
        button { background: #002060; color: #fff; border: 1px solid #4da6ff; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.3s; }
        button:hover { background: #4da6ff; color: #000; }
        #log { font-size: 11px; text-align: left; height: 150px; overflow-y: auto; background: #000; padding: 10px; margin-top: 15px; border: 1px solid #1a2a44; color: #4da6ff; }
        .ok { color: #0f0; }
    </style>
</head>
<body>
    <div class="terminal">
        <h2>TERMINAL V.8.9</h2>
        <div style="font-size: 0.7rem; margin-bottom: 20px;">PROTOCOLO AXIOMA® - VERTEX</div>
        
        <label>OFICIAL DE INTEGRIDAD</label>
        <input type="text" id="nombre" value="OPERADOR VERTEX">
        
        <label>EMAIL PARA SELLO DE INMUTABILIDAD</label>
        <input type="email" id="mail" placeholder="email@titular.com">
        
        <button onclick="iniciarProtocolo()">EJECUTAR BARRIDO INTEGRAL</button>
        
        <div id="log">SISTEMA EN ESPERA...</div>
    </div>

    <script>
        async function iniciarProtocolo() {
            const log = document.getElementById('log');
            const mail = document.getElementById('mail').value;
            const nombre = document.getElementById('nombre').value;
            if(!mail) { alert("Error: Se requiere Email para el Sello Transfronterizo"); return; }
            
            log.innerHTML = "> Iniciando Protocolo de Verificación...<br>";
            
            // LISTA ACTUALIZADA CON CAMIÓN
            const apis = ["BALANZA", "CAMION", "DRON", "RIEGO", "HUMEDAD", "SENTINEL", "WEATHER"];
            
            for(let a of apis){
                log.innerHTML += `> Accediendo a Nodo ${a}... <span class="ok">[CAPTURADO]</span><br>`;
                log.scrollTop = log.scrollHeight;
                await new Promise(r => setTimeout(r, 500));
            }
            
            log.innerHTML += "> Generando Sello de Inmutabilidad Transfronteriza...<br>";
            
            // CAMBIA ESTA URL POR TU ÚLTIMA URL DE DEPLOY (EXEC)
            const url = "https://script.google.com/macros/s/AKfycbzk_6MLAEKE74AW4oQ-FqQUAFCP6Wv1ppHD7M4dL6Rm5h9iQB1wj1wuyyHi8YW2oQd-/exec";
            
            fetch(`${url}?nombre=${encodeURIComponent(nombre)}&mailEmpresa=${encodeURIComponent(mail)}`, {mode:'no-cors'})
            .then(() => {
                log.innerHTML += "<br><span style='color:#0f0; font-weight:bold;'>>>> PROCESO FINALIZADO: IMPACTO EN EXCEL EXITOSO</span>";
            })
            .catch(err => {
                log.innerHTML += "<br><span style='color:red;'>>>> ERROR DE CONEXIÓN CON NODO CENTRAL</span>";
            });
        }
    </script>
</body>
</html>
