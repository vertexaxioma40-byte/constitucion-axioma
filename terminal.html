<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Vertex Axioma | Terminal de Integridad</title>
    <style>
        body { background: #050a15; color: #4da6ff; font-family: 'Courier New', monospace; display: flex; justify-content: center; padding-top: 30px; }
        .terminal { background: #0a1122; border: 2px solid #ff4d4d; width: 480px; padding: 30px; border-radius: 12px; box-shadow: 0 0 30px rgba(255, 77, 77, 0.3); }
        .status-header { text-align:center; color: #ff4d4d; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        #log { font-size: 11px; text-align: left; height: 250px; overflow-y: auto; background: #000; padding: 15px; margin-top: 20px; border: 1px solid #1a2a44; color: #0f0; line-height: 1.4; }
        button { background: #002060; color: #fff; border: 1px solid #4da6ff; padding: 18px; width: 100%; cursor: pointer; font-weight: bold; font-size: 1.1rem; border-radius: 4px; transition: 0.3s; margin-top: 20px; }
        button:hover { background: #ff4d4d; color: #fff; box-shadow: 0 0 15px #ff4d4d; }
        button:disabled { background: #333; cursor: not-allowed; opacity: 0.5; }
        .token-display { font-size: 0.7rem; color: #888; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="terminal">
        <h2 class="status-header">VERTEX AXIOMA®</h2>
        <p style="text-align:center; font-size: 0.7rem; color: #888;">NODO DE INTEGRIDAD FORENSE</p>
        
        <div class="token-display" id="display-token">CARGANDO CREDENCIALES...</div>
        
        <div id="log">> SISTEMA INICIALIZADO...<br>> ESPERANDO ORDEN DE EJECUCIÓN...</div>
        
        <button id="btnEjecutar" onclick="iniciarProtocolo()">INICIAR BARRIDO Y PETRIFICACIÓN</button>
    </div>

    <script>
        // 1. CAPTURAR EL TOKEN DE LA MOCHILA (URL)
        const urlParams = new URLSearchParams(window.location.search);
        const TOKEN_ACTIVO = urlParams.get('token');
        const displayToken = document.getElementById('display-token');
        const log = document.getElementById('log');
        const btn = document.getElementById('btnEjecutar');

        if (!TOKEN_ACTIVO) {
            log.innerHTML = "<span style='color:red;'>[ERROR CRÍTICO] NO SE DETECTÓ TOKEN DE ACCESO. REGRESE AL LOGIN.</span>";
            btn.disabled = true;
        } else {
            displayToken.innerText = "TOKEN DETECTADO: " + TOKEN_ACTIVO;
        }

        async function iniciarProtocolo() {
            btn.disabled = true;
            btn.innerText = "EJECUTANDO PROTOCOLO...";
            
            log.innerHTML += `<br>> Validando Identidad con Bóveda Vertex...`;
            
            // Simulación visual de escaneo de nodos (Protocolo Axioma)
            const nodos = ["BALANZA", "CAMION", "DRON", "RIEGO", "HUMEDAD", "OPTICO", "SENTINEL", "AGROMONITORING", "GOOGLEMAPS", "OPENWEATHER"];
            
            for(let n of nodos) {
                await new Promise(r => setTimeout(r, 300));
                log.innerHTML += `<br>> Nodo ${n}: <span style="color:#0f0">PETRIFICADO OK</span>`;
                log.scrollTop = log.scrollHeight;
            }

            log.innerHTML += `<br>> Generando DNA Digital (Hash Maestro)...`;

            // 2. LLAMADA REAL AL SCRIPT DE GOOGLE USANDO EL TOKEN
            // Reemplaza con tu URL de despliegue actual
            const urlGoogle = "https://script.google.com/macros/s/AKfycbzuUiuPwoHewJiAM4fZuw_3k1zheb3iltIPPCYyUM2FiBpLREQl9b0xe-Krhhad30qW/exec";
            
            try {
                // Enviamos el token como parámetro principal
                await fetch(`${urlGoogle}?token=${TOKEN_ACTIVO}`, {
                    method: 'GET',
                    mode: 'no-cors'
                });
                
                log.innerHTML += "<br><br><span style='color:#0f0; font-weight:bold;'>[EXITO] SELLO DE INMUTABILIDAD TRANSFRONTERIZA EMITIDO.</span>";
                log.innerHTML += "<br>> Verifique su correo electrónico.";
            } catch (e) {
                log.innerHTML += "<br><br><span style='color:red;'>[ERROR] FALLO DE COMUNICACIÓN CON EL SERVIDOR CENTRAL.</span>";
            } finally {
                btn.innerText = "PROTOCOLO FINALIZADO";
                log.scrollTop = log.scrollHeight;
            }
        }
    </script>
</body>
</html>
