<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma | Terminal de Carga 5.0</title>
    <style>
        html, body { 
            background-color: #050a15 !important; 
            color: #ffffff !important; 
            margin: 0; padding: 0; 
            font-family: 'Courier New', Courier, monospace;
        }
        body { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .container { 
            background: #0a1122; 
            padding: 30px; 
            border: 2px solid #002060; 
            border-radius: 8px; 
            box-shadow: 0 0 20px rgba(0, 32, 96, 0.8); 
            width: 100%; max-width: 450px; text-align: center;
        }
        h1 { font-size: 1.4rem; color: #ffffff !important; margin: 0; letter-spacing: 2px; }
        .nodo-sub { color: #4da6ff !important; font-size: 0.8rem; display: block; margin: 10px 0; }
        .divider { height: 1px; background: #002060; margin: 15px 0; }
        form { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
        label { font-size: 0.7rem; color: #4da6ff; text-align: left; text-transform: uppercase; font-weight: bold; }
        input { 
            background: #000 !important; border: 1px solid #4da6ff !important; 
            color: #ffffff !important; padding: 12px; 
            font-family: 'Courier New', monospace; font-size: 0.9rem;
        }
        button { 
            background: #002060; color: #ffffff; border: 1px solid #4da6ff; 
            padding: 18px; cursor: pointer; font-weight: bold;
            text-transform: uppercase; margin-top: 10px; font-size: 0.9rem;
        }
        button:hover { background: #003399; box-shadow: 0 0 10px #4da6ff; }
        .status-msg { font-size: 0.8rem; margin-top: 15px; color: #4da6ff; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>TERMINAL DE CARGA 5.0</h1>
    <span class="nodo-sub">Validación Descentralizada & Metadatos Forenses</span>
    <div class="divider"></div>
    <p style="font-size: 0.8rem; color: #888;">Protocolo AXIOMA®: Registre los metadatos para la emisión del Sello de Inmutabilidad.</p>
    
    <form id="terminal-form">
        <label>Identificación del Responsable</label>
        <input type="text" name="nombre" id="term_nombre" placeholder="NOMBRE COMPLETO" required>
        <input type="email" name="email" id="term_email" placeholder="EMAIL INSTITUCIONAL" required>
        
        <div class="divider"></div>
        
        <label>Auditoría Forense de Activos Reales</label>
        <input type="text" name="titular" id="term_titular" placeholder="TITULAR (EJ: GABRIEL ALEJANDRO VADELL)" required>
        <input type="text" name="activo" id="term_activo" placeholder="ACTIVO (EJ: LITIO / ORO / COBRE)" required>
        <input type="text" name="pureza" id="term_pureza" placeholder="PUREZA (EJ: 99.5%)" required>
        <input type="text" name="peso" id="term_peso" placeholder="PESO NETO (EJ: 1500 KG)" required>
        <input type="text" name="coords" id="coords-input" placeholder="LOCALIZACIÓN GPS" required>
        
        <button type="submit" id="submit-btn">AUTORIZAR Y PETRIFICAR REGISTRO</button>
        <div id="status" class="status-msg">CONEXIÓN ESTABLE CON NODO PRIMARIO. ESPERANDO DATOS...</div>
    </form>
</div>

<script>
    // URL ÚNICA DE TU SCRIPT DE GOOGLE
    const URL_API = "https://script.google.com/macros/s/AKfycbyUY_jc_gXQQPo3ialGzdnizl2R_r246kXH3_adMjiuVMwpi7194JLQWSYBO4OZ0wI5/exec";
    
    const form = document.getElementById('terminal-form');
    const btn = document.getElementById('submit-btn');
    const status = document.getElementById('status');

    window.onload = () => {
        // GPS automático
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                document.getElementById('coords-input').value = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
            });
        }

        // Recuperar datos de localStorage
        document.getElementById('term_nombre').value = localStorage.getItem('vertex_nombre') || "";
        document.getElementById('term_email').value = localStorage.getItem('vertex_email') || "";
    };

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        btn.style.display = "none";
        status.style.display = "block";
        status.innerText = "BLOQUEANDO CADENA DE CUSTODIA...";

        // Capturamos los datos del formulario de forma limpia
        const formData = new FormData(form);
        const params = new URLSearchParams();
        
        for (const [key, value] of formData.entries()) {
            params.append(key, value);
        }

        const finalURL = `${URL_API}?${params.toString()}`;

        // Técnica de inyección de script para envío forzado (bypass CORS)
        const scriptElement = document.createElement('script');
        scriptElement.src = finalURL;
        
        // Manejador de éxito visual
        setTimeout(() => {
            status.innerText = "¡REGISTRO PETRIFICADO EXITOSAMENTE!";
            alert("🛡️ Sello de Inmutabilidad Transfronteriza Emitido para Vertex Axioma.");
            window.location.href = 'index.html';
        }, 2500);

        document.body.appendChild(scriptElement);
    });
</script>

</body>
</html>
