<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Axioma - API de Integridad</title>
    <style>
        :root {
            --azul-axioma: #00a3ff; /* Azul brillante para Dark Mode */
            --dorado-forense: #C5A059;
            --fondo-oscuro: #050a14;
            --tarjeta-oscura: #0a1120;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--fondo-oscuro);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--tarjeta-oscura);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #1e2a44;
            box-shadow: 0 0 25px rgba(0, 163, 255, 0.15);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        img.logo {
            max-width: 220px;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        h2 { 
            color: #ffffff; 
            font-size: 1.5rem; 
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        p { 
            color: #8892b0; 
            font-size: 0.9rem; 
            margin-bottom: 25px; 
        }
        
        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: #000000;
            color: var(--azul-axioma);
            border: 1px solid #1e2a44;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            text-align: center;
            transition: all 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--azul-axioma);
            box-shadow: 0 0 10px rgba(0, 163, 255, 0.3);
            outline: none;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-carga {
            background-color: #002060;
            color: white;
            border: 1px solid var(--azul-axioma);
        }
        .btn-consulta {
            background-color: var(--dorado-forense);
            color: #050a14;
        }
        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }
        .footer {
            margin-top: 30px;
            font-size: 0.7rem;
            color: #444;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://raw.githubusercontent.com/USUARIO/REPOSITORIO/main/Logo.jpg" alt="Vertex Axioma" class="logo">
    
    <h2>Centro de Mando</h2>
    <p>Protocolo de Integridad Forense 4.9</p>

    <input type="text" id="tokenInput" placeholder="Ingrese su Token Vertex">

    <div class="btn-group">
        <button class="btn-carga" onclick="ejecutar('carga')">INICIAR BARRIDO DE NODOS</button>
        <button class="btn-consulta" onclick="ejecutar('consulta')">CONSULTAR ACTIVOS</button>
    </div>

    <div class="footer">
        CONSTITUCIÓN AXIOMA® | PROTECCIÓN FORENSE
    </div>
</div>

<script>
    function ejecutar(accion) {
        const token = document.getElementById('tokenInput').value;
        const scriptURL = "https://script.google.com/macros/s/AKfycbyQzr7TOGV__V6ZrhaQbT_p2mmd9AW2FPkVpZP-OnLhwRd5afJ5V2Hh1wvD0A4y5Qcd/exec";

        if (!token) {
            alert("Por favor, ingrese un token válido.");
            return;
        }

        const finalURL = `${scriptURL}?token=${token}&accion=${accion}`;
        window.location.href = finalURL;
    }
</script>

</body>
</html>
