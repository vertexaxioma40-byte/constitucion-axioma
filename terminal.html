<script>
    // --- LÓGICA DE PRIORIDAD VERTEX v5.5 ---
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        
        // 1. Capturamos lo que viene del Índice (URL)
        const urlNombre = urlParams.get('nombre');
        const urlEmail = urlParams.get('email');
        const urlActivo = urlParams.get('activo');
        const urlPureza = urlParams.get('pureza');
        const urlPeso = urlParams.get('peso');
        const urlCoords = urlParams.get('coords');

        // 2. APLICAR PRIORIDAD: Si hay URL, manda la URL y limpia la memoria vieja
        if (urlNombre) {
            document.getElementById('nombre').value = urlNombre;
            localStorage.setItem('v_nombre', urlNombre); 
        } else if (localStorage.getItem('v_nombre')) {
            document.getElementById('nombre').value = localStorage.getItem('v_nombre');
        }

        if (urlEmail) {
            document.getElementById('email').value = urlEmail;
            localStorage.setItem('v_email', urlEmail);
        } else if (localStorage.getItem('v_email')) {
            document.getElementById('email').value = localStorage.getItem('v_email');
        }

        // 3. Carga forzada de datos del activo (siempre manda el índice aquí)
        if (urlActivo) document.getElementById('activo').value = urlActivo;
        if (urlPureza) document.getElementById('pureza').value = urlPureza;
        if (urlPeso) document.getElementById('peso').value = urlPeso;
        if (urlCoords) document.getElementById('coords').value = urlCoords;
    };

    function enviarDatos() {
        const btn = document.querySelector('button');
        const status = document.getElementById('status');
        // Tu URL de ejecución v5.8
        const urlBase = "https://script.google.com/macros/s/AKfycbwuJeVqxmQkdQY-4qBQD92QTt_4NXYJNsL3kFgy1ZNVb6iYR3TkwlSNSRLWSVEdAH9v/exec"; 
        
        const fields = {
            nombre: document.getElementById('nombre').value,
            email: document.getElementById('email').value,
            activo: document.getElementById('activo').value,
            pureza: document.getElementById('pureza').value,
            peso: document.getElementById('peso').value,
            coords: document.getElementById('coords').value
        };

        if(!fields.nombre || !fields.email || !fields.coords) {
            mostrarStatus("⚠️ Error: Faltan datos críticos para el Sello.", "error");
            return;
        }

        btn.disabled = true;
        btn.innerText = "PETRIFICANDO EN MONITOR...";
        status.style.display = "none";

        const params = new URLSearchParams(fields).toString();
        fetch(`${urlBase}?${params}`)
            .then(r => r.text())
            .then(data => {
                mostrarStatus("✅ ¡Impacto Exitoso en MONITOR! Sello Inmutable generado.", "success");
                btn.disabled = false;
                btn.innerText = "PETRIFICAR REGISTRO 4.0";
            })
            .catch(err => {
                mostrarStatus("❌ Error de comunicación con el Nodo.", "error");
                btn.disabled = false;
                btn.innerText = "REINTENTAR";
            });
    }

    function mostrarStatus(msg, tipo) {
        const status = document.getElementById('status');
        status.innerText = msg;
        status.className = tipo;
        status.style.display = "block";
    }
</script>
