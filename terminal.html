<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { background-color: #000; color: #0f0; font-family: 'Courier New', monospace; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .console { border: 1px solid #0f0; padding: 20px; width: 90%; max-width: 600px; background: #050a15; box-shadow: 0 0 15px rgba(0,255,0,0.3); }
    .status { color: #888; font-size: 0.8rem; margin-bottom: 10px; }
    .btn-petrificar { background: #0f0; color: #000; padding: 20px; width: 100%; font-size: 1.2rem; cursor: pointer; border: none; font-weight: bold; margin-top: 20px; }
    .btn-petrificar:hover { background: #fff; }
    #log { font-size: 0.9rem; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="console">
    <div class="status">SISTEMA AXIOMA V4.0 - ESTADO: ONLINE</div>
    <div id="log">> INICIALIZANDO NODO...<br>> CARGANDO CREDENCIALES...</div>
    <br>
    <select id="idActivo" style="width:100%; background:black; color:#0f0; border:1px solid #0f0; padding:10px;">
        <option value="CAMION_SCANIA_01">CAMIÓN SCANIA 01</option>
        <option value="DJI_ENTERPRISE_P1">DJI ENTERPRISE P1</option>
        <option value="SILO_ACOPIO_A">SILO ACOPIO A</option>
    </select>
    <button class="btn-petrificar" id="btn-p" onclick="ejecutar()">🛡️ PETRIFICAR EVIDENCIA</button>
  </div>

  <script>
    const d = JSON.parse(localStorage.getItem('v_datos'));
    
    if(d) {
      document.getElementById('log').innerHTML += `<br>> OPERADOR: ${d.nombre}<br>> TITULAR: ${d.titular}`;
    }

    function ejecutar() {
      const btn = document.getElementById('btn-p');
      btn.disabled = true;
      btn.innerText = "PROCESANDO...";
      
      const payload = {
        ...d,
        idActivo: document.getElementById('idActivo').value,
        idOperacion: "VTX-" + Math.random().toString(36).substr(2, 7).toUpperCase(),
        fuente: "Consola Directa"
      };

      google.script.run.withSuccessHandler(() => {
        document.getElementById('log').innerHTML += "<br>> SELLO GENERADO CON ÉXITO.<br>> REVISAR MAIL PARA PDF.";
        alert("EVIDENCIA PETRIFICADA.");
        btn.disabled = false;
        btn.innerText = "🛡️ PETRIFICAR EVIDENCIA";
      }).procesarEntradaVertex(payload);
    }
  </script>
</body>
</html>
