<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vertex Axioma | Terminal</title>
    <style>
        body { background: #050a15; color: white; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        .box { background: #0a1122; padding: 20px; border: 1px solid #002060; border-radius: 10px; width: 350px; }
        input { width: 90%; margin: 10px 0; padding: 10px; background: #000; border: 1px solid #4da6ff; color: white; }
        button { width: 100%; padding: 15px; background: #002060; color: white; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h3>TERMINAL VERTEX</h3>
        <form id="v-form">
            <input type="text" name="nombre" id="n" placeholder="Nombre" required>
            <input type="email" name="email" id="e" placeholder="Email" required>
            <hr>
            <input type="text" name="titular" placeholder="Titular (Ej: Vadell)" required>
            <input type="text" name="activo" placeholder="Activo (Ej: Litio)" required>
            <input type="text" name="pureza" placeholder="Pureza" required>
            <input type="text" name="peso" placeholder="Peso" required>
            <input type="hidden" name="coords" id="c">
            <button type="submit" id="b">PETRIFICAR</button>
        </form>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbz65d3Z_mJBXlTnBqwzT7_nlby_Mrhygd43LYBX2wTCHkXXMsDFbytOL23CFz1sg6c/exec"; // <--- ACTUALIZA ESTO

        // RECUPERAR MEMORIA DEL ÍNDICE
        window.onload = () => {
            document.getElementById('n').value = localStorage.getItem('vertex_nombre') || "";
            document.getElementById('e').value = localStorage.getItem('vertex_email') || "";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => {
                    document.getElementById('c').value = p.coords.latitude.toFixed(5) + ", " + p.coords.longitude.toFixed(5);
                });
            }
        };

        document.getElementById('v-form').onsubmit = (e) => {
            e.preventDefault();
            document.getElementById('b').innerText = "ENVIANDO...";
            const params = new URLSearchParams(new FormData(e.target)).toString();
            fetch(API + "?" + params, { mode: 'no-cors' }).then(() => {
                alert("🛡️ Sello Emitido.");
                window.location.href = 'index.html';
            });
        };
    </script>
</body>
</html>
